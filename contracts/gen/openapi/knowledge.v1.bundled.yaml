    post:
      operationId: captureEntry
      summary: Capture an entry into the caller's personal layer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeEntryInput'
      responses:
        '201':
          description: Captured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeEntry'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/personal/entries/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: deleteEntry
      summary: Delete one of the caller's personal entries
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/proposals:
    get:
      operationId: listProposals
      summary: Proposals the caller made, or may review
