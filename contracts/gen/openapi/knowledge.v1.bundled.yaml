      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgePack
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgePackSpec
          type: object
          additionalProperties: false
          required:
          - layer
          properties:
            layer:
              type: string
              enum:
              - company
              - role
              - team
              description: Personal layers are per person and are not packs.
            mandatory:
              description: Users and agents cannot switch a mandatory pack off.
              type: boolean
            reviewers:
              type: array
              items:
                type: string
              description: People (actor names) who may approve or reject proposals
                and roll back versions.
              minItems: 1
            mergePolicy:
              title: MergePolicy
              type: object
              additionalProperties: false
              properties:
                requires:
                  type: array
                  items:
                    type: string
                    enum:
                    - review
                    - evaluation
            storageLocation:
              description: Customer-bound object storage location for pack content.
              type: string
    KnowledgePackPage:
      title: KnowledgePackPage
      description: The tenant's packs.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePackRecord'
    KnowledgePackRecord:
      title: KnowledgePackRecord
      description: A pack definition and its latest content version.
      type: object
      additionalProperties: false
      required:
      - document
      - latestVersion
      - createdAt
      - updatedAt
      properties:
        document:
          $ref: '#/components/schemas/KnowledgePack'
        latestVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeRead:
      title: KnowledgeRead
      description: 'One retrieval a person made: what they were shown, never the query
        text (invariant 5).'
      type: object
      additionalProperties: false
      required:
      - id
      - person
      - at
      - tool
      - resultCount
      - citations
      properties:
        id:
          type: string
          format: uuid
        person:
          type: string
        at:
          type: string
          format: date-time
        tool:
          type: string
          enum:
          - rest.retrieve
          - mcp.search_knowledge
        resultCount:
          type: integer
          minimum: 0
        citations:
          type: array
          items:
            title: ReadCitation
            type: object
            additionalProperties: false
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - entry
                - document
              entryKey:
                type: string
              layer:
                type: string
              pack:
                type: string
              version:
                type: string
              source:
                type: string
              externalId:
                type: string
    KnowledgeReadPage:
      title: KnowledgeReadPage
      description: The caller's own reads, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRead'
    KnowledgeSource:
      title: KnowledgeSource
      description: A document source attached to a pack (PRD section 10). Its documents
        are indexed, and every retrieval authorises each document live against the
        acting person's own rights at the source.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgeSource
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgeSourceSpec
          type: object
          additionalProperties: false
          required:
          - pack
          - connector
          properties:
            pack:
              description: The pack whose readers search this source.
              type: string
            connector:
              description: sharepoint is release 1's one source (not built yet). test
                is an in-memory connector for development and the adversarial suite,
                refused unless explicitly enabled.
              type: string
              enum:
              - sharepoint
              - test
            sharepoint:
              title: SharePointSourceConfig
              type: object
              additionalProperties: false
              required:
              - siteUrl
              properties:
                siteUrl:
                  type: string
            test:
              title: TestSourceConfig
              type: object
              additionalProperties: false
              required:
              - documents
              properties:
                documents:
                  type: array
                  maxItems: 500
                  items:
                    title: TestSourceDocument
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - title
                    - body
                    - readers
                    properties:
                      id:
                        type: string
                        minLength: 1
                      title:
                        type: string
                      body:
                        type: string
                      url:
                        type: string
                      readers:
                        description: Actor names who may open the document.
                        type: array
                        items:
                          type: string
    KnowledgeSourcePage:
      title: KnowledgeSourcePage
      description: The tenant's sources.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSourceRecord'
    KnowledgeSourceRecord:
      title: KnowledgeSourceRecord
      description: A source and its index state.
      type: object
      additionalProperties: false
      required:
      - document
      - documentCount
      - createdAt
      - updatedAt
      properties:
        document:
          $ref: '#/components/schemas/KnowledgeSource'
        documentCount:
          type: integer
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ObjectMeta:
      title: ObjectMeta
      description: Metadata shared by every Muistamo YAML kind.
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          description: Unique name of the object within its tenant.
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        owner:
          description: Owning team or person reference.
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    PackEntry:
      title: PackEntry
      description: An entry in a pack version, with lineage.
      type: object
      additionalProperties: false
      required:
      - entry
      - proposal
      - reviewer
      properties:
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        proposal:
          description: The proposal that merged it.
          type: string
          format: uuid
        reviewer:
          type: string
    PackVersion:
      title: PackVersion
      description: An immutable version of a pack's content.
      type: object
      additionalProperties: false
      required:
      - pack
      - version
      - reason
      - createdBy
      - createdAt
      - entries
      properties:
        pack:
          type: string
        version:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
        parent:
          type: string
        reason:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PackEntry'
    PackVersionPage:
      title: PackVersionPage
      description: A pack's versions, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackVersion'
    Problem:
      title: Problem
      description: Error body (RFC 9457 problem details).
      type: object
      required:
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Proposal:
      title: Proposal
      description: A proposal of entries to a pack, with check results and the decision.
      type: object
      additionalProperties: false
      required:
      - id
      - pack
      - contributor
      - summary
      - status
      - entries
      - checks
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        pack:
          type: string
        contributor:
          type: string
        summary:
          type: string
        status:
          type: string
          enum:
          - checks-failed
          - in-review
          - approved
          - rejected
        entries:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        decision:
          $ref: '#/components/schemas/ProposalDecisionRecord'
        mergedVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    ProposalDecision:
      title: ProposalDecision
      description: A reviewer's decision on a proposal.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        edits:
          description: 'Approve with edits: replacement bodies by entry key.'
          type: array
          items:
            title: EntryEdit
            type: object
            additionalProperties: false
            required:
            - key
            - body
            properties:
              key:
                description: Stable key; the most specific layer wins for the same
                  key.
                type: string
                pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
                maxLength: 120
              body:
                type: string
                minLength: 1
                maxLength: 20000
    ProposalDecisionRecord:
      title: ProposalDecisionRecord
      description: The reviewer's decision.
      type: object
      additionalProperties: false
      required:
      - reviewer
      - decision
      - reason
      - decidedAt
      properties:
        reviewer:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    ProposalInput:
      title: ProposalInput
      description: Propose personal entries to a pack.
      type: object
      additionalProperties: false
      required:
      - pack
      - entryIds
      - summary
      properties:
        pack:
          type: string
        entryIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        summary:
          type: string
          minLength: 1
          maxLength: 2000
    ProposalPage:
      title: ProposalPage
      description: Proposals visible to the caller.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
    ResolvedEntry:
      title: ResolvedEntry
      description: An effective entry for the caller, and where it came from.
      type: object
      additionalProperties: false
      required:
      - entry
      - layer
      properties:
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        layer:
          type: string
          enum:
          - personal
          - team
          - role
          - company
        pack:
          type: string
        version:
          type: string
    ResolvedEntryPage:
      title: ResolvedEntryPage
      description: The caller's effective knowledge.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedEntry'
    RetrievalResult:
      title: RetrievalResult
      description: Results the caller may see, each cited, and which sources were
        consulted.
      type: object
      additionalProperties: false
      required:
      - query
      - items
      - coverage
      properties:
        query:
          type: string
        items:
          type: array
          items:
            title: RetrievalItem
            type: object
            additionalProperties: false
            required:
            - title
            - snippet
            - score
            - citation
            properties:
              title:
                type: string
              snippet:
                type: string
              score:
                type: number
              citation:
                $ref: '#/components/schemas/Citation'
        coverage:
          title: RetrievalCoverage
          type: object
          additionalProperties: false
          required:
          - sourcesQueried
          - sourcesUnavailable
          - testConnectors
          properties:
            sourcesQueried:
              type: array
              items:
                type: string
            sourcesUnavailable:
              description: Sources whose authorisation failed; their documents were
                withheld, never returned unchecked.
              type: array
              items:
                type: string
            testConnectors:
              description: Sources served by the in-memory test connector, not a real
                system.
              type: array
              items:
                type: string
    RollbackInput:
      title: RollbackInput
      description: Publish a new version with an earlier version's content.
      type: object
      additionalProperties: false
      required:
      - toVersion
      - reason
      properties:
        toVersion:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    SyncResult:
      title: SyncResult
      description: What a sync changed in the index.
      type: object
      additionalProperties: false
      required:
      - source
      - indexed
      - removed
      - total
      properties:
        source:
          type: string
        indexed:
          type: integer
        removed:
          type: integer
        total:
          type: integer
