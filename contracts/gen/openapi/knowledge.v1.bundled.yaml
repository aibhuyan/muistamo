        '200':
          $ref: '#/components/responses/Proposal'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/resolve:
    get:
      operationId: resolve
      summary: The caller's effective entries across layers; the most specific layer
        wins
      parameters:
      - name: packs
        in: query
        required: false
        description: Comma-separated pack names. Mandatory packs are always included.
        schema:
          type: string
      responses:
        '200':
          description: Effective entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedEntryPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/sources:
    get:
      operationId: listSources
