        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/packs/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      operationId: getPack
      responses:
        '200':
          $ref: '#/components/responses/PackRecord'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: applyPack
      summary: Create or update a pack definition (content changes only through proposals)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgePack'
      responses:
        '200':
          $ref: '#/components/responses/PackRecord'
        '201':
          $ref: '#/components/responses/PackRecord'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/packs/{name}/versions:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      operationId: listPackVersions
      responses:
        '200':
          description: The pack's versions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackVersionPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/packs/{name}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/Name'
    - name: version
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getPackVersion
      responses:
        '200':
          $ref: '#/components/responses/PackVersion'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/packs/{name}/versions/{version}/skills.zip:
    parameters:
    - $ref: '#/components/parameters/Name'
    - name: version
      in: path
      required: true
      description: A published version, or "latest".
      schema:
        type: string
    get:
      operationId: exportSkills
      summary: The version as a deterministic Agent Skills zip (agentskills.io)
      description: One SKILL.md for the pack (facts, an index of procedures, examples
        in references/) and one per skill entry. Only published, reviewed content;
        never personal layers or open proposals. Each export is recorded as evidence
        with the archive's SHA-256.
      responses:
        '200':
          description: The archive. X-Muistamo-Pack-Version names the exported version.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/packs/{name}/rollback:
    parameters:
    - $ref: '#/components/parameters/Name'
    post:
      operationId: rollbackPack
      summary: Publish a new version with an earlier version's content (reviewers
        only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollbackInput'
      responses:
        '201':
          $ref: '#/components/responses/PackVersion'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/personal/entries:
    get:
