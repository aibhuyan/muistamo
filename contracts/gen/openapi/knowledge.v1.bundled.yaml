        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeSource'
      responses:
        '200':
          $ref: '#/components/responses/SourceRecord'
        '201':
          $ref: '#/components/responses/SourceRecord'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/sources/{name}/sync:
    parameters:
    - $ref: '#/components/parameters/Name'
    post:
      operationId: syncSource
      summary: Re-index the source's documents (the pack's reviewers only)
      responses:
        '200':
          description: What changed in the index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/retrieve:
    get:
      operationId: retrieve
      summary: Search the caller's effective entries and the requested packs' documents
      description: Every document is authorised live against the acting person's own
        rights at its source before it is returned (invariant 1). If a source cannot
        authorise, its documents are withheld and the source is listed as unavailable.
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: packs
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Authorised, cited results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalResult'
        default:
          $ref: '#/components/responses/Problem'
  /v1/knowledge/reads:
    get:
      operationId: listReads
      summary: The caller's own knowledge reads (citations only, never query text)
      parameters:
      - name: limit
