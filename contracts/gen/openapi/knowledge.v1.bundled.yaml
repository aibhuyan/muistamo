  schemas:
    AccessExport:
      title: AccessExport
      description: 'Everything one service holds about a person: one section per data
        location, each a list of records as stored, plus the evidence events they
        took part in.'
      type: object
      additionalProperties: false
      required:
      - service
      - generatedAt
      - sections
      properties:
        service:
          type: string
          enum:
          - control-plane
          - knowledge
        generatedAt:
          type: string
          format: date-time
        sections:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
    AccessRequest:
      title: AccessRequest
      description: Export everything a service holds about a person (GDPR Art 15,
        FR-309).
      type: object
      additionalProperties: false
      required:
      - subject
      properties:
        subject:
          $ref: '#/components/schemas/PrivacySubject'
    ActionPolicy:
      title: ActionPolicy
      description: 'The actions agents of one template may take with their tools (PRD
        section 8.1, FR-1004). Deny overrides allow: when any deny rule applies, the
        action is denied whatever else allows it, so rule order does not matter. Release
        1 effects are allow, deny and monitor; requireApproval is release 2. At most
        one ActionPolicy applies to a template. A clone keeps its template''s policy;
        a policy for a clone may only add deny and monitor rules, never allow, default
        or mode, so it can restrict a clone but never widen it.'
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: ActionPolicy
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: ActionPolicySpec
          type: object
          additionalProperties: false
          required:
          - appliesTo
          - rules
          properties:
            appliesTo:
              title: ActionPolicyTarget
              description: A template (covering its clones) or one clone. A clone
                also keeps its template's policy; its own may only narrow it.
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                template:
                  type: string
                  pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                clone:
                  type: string
                  pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            default:
              description: 'What happens to actions no rule allows: deny (the default)
                or allow. allow still yields to every deny rule.'
              type: string
              enum:
              - deny
              - allow
            mode:
              description: 'enforce (the default): once the gateway enforces, denied
                actions are blocked. monitor: they are only reported.'
              type: string
              enum:
              - enforce
              - monitor
            rules:
              type: array
              items:
                title: ActionRule
                type: object
                additionalProperties: false
                required:
                - action
                - effect
                properties:
                  action:
                    description: A tool action, for example email.send.
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,62}(\.[a-z0-9_-]{1,63}){0,3}$
                  effect:
                    description: allow, deny, or monitor (allow, and flag for review).
                      requireApproval is release 2.
                    type: string
                    enum:
                    - allow
                    - deny
                    - monitor
                  when:
                    description: 'Request attributes that must all be true for the
                      rule to apply. An attribute the request does not supply counts
                      against the caller: it stops an allow or monitor rule applying,
                      and lets a deny rule apply.'
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}(\.[A-Za-z][A-Za-z0-9_]{0,63}){0,3}$
                  unless:
                    description: Request attributes any one of which, when true, stops
                      the rule applying. A missing attribute counts against the caller,
                      as for when.
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}(\.[A-Za-z][A-Za-z0-9_]{0,63}){0,3}$
          if:
            properties:
              appliesTo:
                required:
                - clone
          then:
            not:
              anyOf:
              - required:
                - default
              - required:
                - mode
            properties:
              rules:
                items:
                  properties:
                    effect:
                      enum:
                      - deny
                      - monitor
    ActionPolicyPage:
      title: ActionPolicyPage
      description: Every ActionPolicy in the tenant, by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionPolicyRecord'
    ActionPolicyRecord:
      title: ActionPolicyRecord
      description: The current ActionPolicy. Revision increments on every change.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/ActionPolicy'
    AgentClone:
      title: AgentClone
      description: A variant of a template with its own instances (PRD section 5,
        FR-103). The overlay can add knowledge packs and set its own budget and HR
        assignment; nothing else of the template can change. Because the overlay changes
        who gets an agent and with what knowledge, only catalogue approvers create,
        change or sync clones, and a clone cannot take a template's name.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentClone
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: AgentCloneSpec
          type: object
          additionalProperties: false
          required:
          - template
          - sync
          properties:
            template:
              description: The source template's name.
              type: string
              pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            sync:
              description: 'follow: always the template''s catalogue-published version.
                pin: the version below. manual: stays on its version and reports a
                newer published one until synced.'
              type: string
              enum:
              - follow
              - pin
              - manual
            version:
              description: 'pin only: the template version to use.'
              type: integer
              minimum: 1
            overlay:
              title: AgentCloneOverlay
              type: object
              additionalProperties: false
              properties:
                knowledgePacks:
                  description: Packs added to the template's. For a pack the template
                    already uses, this version constraint wins.
                  type: array
                  items:
                    $ref: '#/components/schemas/KnowledgePackRef'
                budget:
                  title: AgentCloneBudget
                  type: object
                  additionalProperties: false
                  properties:
                    perInstanceMonthlyEUR:
                      type: number
                      minimum: 0
                assignment:
                  title: AgentCloneAssignment
                  description: Joiners whose job code is listed get this clone instead
                    of the plain template.
                  type: object
                  additionalProperties: false
                  properties:
                    hrJobCodes:
                      type: array
                      items:
                        type: string
          if:
            properties:
              sync:
                const: pin
          then:
            required:
            - version
          else:
            not:
              required:
              - version
    AgentClonePage:
      title: AgentClonePage
      description: Clones, by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentCloneRecord'
    AgentCloneRecord:
      title: AgentCloneRecord
      description: A clone and how it currently resolves. Revision increments on every
        change to the document or the synced version.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      - assignable
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/AgentClone'
        resolvedVersion:
          description: The template version the clone uses now; absent when it cannot
            resolve.
          type: integer
          minimum: 1
        upstreamVersion:
          description: The template's published version, when it differs from resolvedVersion.
          type: integer
          minimum: 1
        assignable:
          description: 'Whether joiners can get this clone: its resolved version is
            the published one.'
          type: boolean
        reason:
          description: Why the clone is not assignable, or is behind upstream.
          type: string
    AgentInstance:
      title: AgentInstance
      description: An agent bound to a user, team or service, with its own identity
        (PRD section 5). Usually generated.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentInstance
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: AgentInstanceSpec
          type: object
          additionalProperties: false
          required:
          - templateRef
          - binding
          - state
          properties:
            templateRef:
              title: TemplateRef
              type: object
              additionalProperties: false
              required:
              - name
              - version
              properties:
                name:
                  type: string
                version:
                  description: Template version number assigned by the server, for
                    example "3".
                  type: string
                  pattern: ^[1-9][0-9]*$
            cloneRef:
              description: Set when the instance belongs to a clone of templateRef's
                template. Its effective spec then comes through the clone.
              type: string
              pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            binding:
              title: InstanceBinding
              type: object
              additionalProperties: false
              required:
              - type
              - ref
              properties:
                type:
                  type: string
                  enum:
                  - user
                  - team
                  - service
                ref:
                  type: string
            identityRef:
              description: Identity ID of the instance in the identity provider.
              type: string
            sponsor:
              type: string
            delegate:
              type: string
            personalLayerRef:
              type: string
            state:
              description: Must be requested on create; changes only through transitions.
              $ref: '#/components/schemas/InstanceState'
            costCentre:
              type: string
    AgentInstancePage:
      title: AgentInstancePage
      description: A page of instances, ordered by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstanceRecord'
        nextCursor:
          description: Absent on the last page.
          type: string
    AgentInstanceRecord:
      title: AgentInstanceRecord
      description: The current state of an AgentInstance. Revision increments on every
        change.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - document
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        document:
          $ref: '#/components/schemas/AgentInstance'
    AgentLink:
      title: AgentLink
      description: 'A one-way permission for agents of one template to call agents
        of another (PRD section 8.1, FR-1003). Without a link, calls are denied. Release
        1: links between Muistamo-hosted templates only; links to external A2A agents
        are release 2.'
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentLink
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: AgentLinkSpec
          type: object
          additionalProperties: false
          required:
          - from
          - to
          - allowedSkills
          - dataClasses
          properties:
            from:
              $ref: '#/components/schemas/AgentLinkEndpoint'
              description: The calling agents.
            to:
              $ref: '#/components/schemas/AgentLinkEndpoint'
              description: The called agents. The link never allows calls the other
                way.
            allowedSkills:
              description: Skills of the called agent the caller may use.
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
            dataClasses:
              description: Data classes a call may carry. A call carrying any other
                class is denied.
              type: array
              uniqueItems: true
              items:
                type: string
                pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
            actFor:
              description: 'same-user (the default): the called agent acts with the
                calling human''s own access. service: it acts as itself.'
              type: string
              enum:
              - same-user
              - service
            maxDelegationDepth:
              description: 'The deepest point in a delegation chain at which this
                call is allowed. 1 (the default) means direct calls only: the called
                agent may not pass the work on.'
              type: integer
              minimum: 1
              maximum: 5
            rateLimit:
              description: 'For example 60/min. Stored, but not yet evaluated: it
                needs the gateway''s counters.'
              type: string
              pattern: ^[1-9][0-9]{0,6}/(s|min|h|day)$
    AgentLinkEndpoint:
      title: AgentLinkEndpoint
      description: 'One end of an AgentLink: a template (covering its clones too)
        or one clone. Instances, labels and external agents come later.'
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        template:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        clone:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
    AgentLinkPage:
      title: AgentLinkPage
      description: Every AgentLink in the tenant, by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentLinkRecord'
    AgentLinkRecord:
      title: AgentLinkRecord
      description: The current AgentLink. Revision increments on every change.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/AgentLink'
    AgentTemplate:
      title: AgentTemplate
      description: A reusable agent definition owned by the company (PRD section 5).
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentTemplate
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          $ref: '#/components/schemas/AgentTemplateSpec'
    AgentTemplatePage:
      title: AgentTemplatePage
      description: A page of latest template versions, ordered by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentTemplateRecord'
        nextCursor:
          description: Absent on the last page.
          type: string
    AgentTemplateRecord:
      title: AgentTemplateRecord
      description: One immutable, server-numbered version of an AgentTemplate.
      type: object
      additionalProperties: false
      required:
      - version
      - createdAt
      - createdBy
      - document
      properties:
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        document:
          $ref: '#/components/schemas/AgentTemplate'
    AgentTemplateSpec:
      title: AgentTemplateSpec
      description: What an agent template defines (PRD section 5).
      type: object
      additionalProperties: false
      required:
      - purpose
      - modelAlias
      properties:
        purpose:
          type: string
        riskTier:
          type: string
          enum:
          - low
          - medium
          - high
        modelAlias:
          description: Name of a ModelAlias, never a concrete provider model.
          type: string
        knowledgePacks:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePackRef'
        tools:
          type: array
          items:
            type: string
        dataClasses:
          type: array
          items:
            type: string
        autonomy:
          type: string
        assignment:
          title: AgentTemplateAssignment
          type: object
          additionalProperties: false
          properties:
            hrJobCodes:
              type: array
              items:
                type: string
        budget:
          title: AgentTemplateBudget
          type: object
          additionalProperties: false
          properties:
            perInstanceMonthlyEUR:
              type: number
              minimum: 0
        evaluationSet:
          type: string
    CatalogueApproval:
      description: One approver's decision on a catalogue request.
      title: CatalogueApproval
      type: object
      additionalProperties: false
      required:
      - approver
      - decision
      - reason
      - decidedAt
      properties:
        approver:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    CatalogueDecision:
      title: CatalogueDecision
      description: An approver's decision on a catalogue request.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    CatalogueEntry:
      title: CatalogueEntry
      description: A template version published to the catalogue and so assignable
        to joiners.
      type: object
      additionalProperties: false
      required:
      - template
      - version
      - requestId
      - publishedAt
      properties:
        template:
          type: string
        version:
          type: integer
          minimum: 1
        requestId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    CatalogueEntryPage:
      title: CatalogueEntryPage
      description: The published catalogue.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueEntry'
    CatalogueRequest:
      title: CatalogueRequest
      description: A request to publish a template version to the catalogue. Low risk
        publishes at once; medium needs one approver; high needs two distinct approvers;
        never the requester.
      type: object
      additionalProperties: false
      required:
      - id
      - template
      - version
      - requestedBy
      - riskTier
      - neededApprovals
      - state
      - approvals
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        template:
          type: string
        version:
          type: integer
          minimum: 1
        requestedBy:
          type: string
        riskTier:
          description: From the template version; a version without one is treated
            as high.
          type: string
          enum:
          - low
          - medium
          - high
        neededApprovals:
          type: integer
          minimum: 0
          maximum: 2
        state:
          type: string
          enum:
          - pending
          - published
          - rejected
          - withdrawn
          - superseded
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueApproval'
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    CatalogueRequestPage:
      title: CatalogueRequestPage
      description: Catalogue requests, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueRequest'
    CheckResult:
      title: CheckResult
      description: One automated check finding. Matched secret values are never echoed.
      type: object
      additionalProperties: false
      required:
      - ruleId
      - severity
      - entryKey
      - message
      properties:
        ruleId:
          type: string
        severity:
          type: string
          enum:
          - blocking
          - warning
        entryKey:
          type: string
        message:
          type: string
    Citation:
      title: Citation
      description: Where a retrieval result came from.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - entry
          - document
        layer:
          type: string
          enum:
          - personal
          - team
          - role
          - company
        pack:
          type: string
        version:
          type: string
        entryKey:
          type: string
        source:
          type: string
        connector:
          type: string
        externalId:
          type: string
        url:
          type: string
        modifiedAt:
          type: string
          format: date-time
    CompiledPolicies:
      title: CompiledPolicies
      description: The tenant's links and action policies as the Cedar policy set
        that is actually evaluated, for review.
      type: object
      additionalProperties: false
      required:
      - cedar
      - rules
      properties:
        cedar:
          description: Cedar policy text, ordered by policy id.
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRuleRef'
    EffectiveAgentSpec:
      title: EffectiveAgentSpec
      description: 'What an instance actually runs with: its template version''s spec,
        with its clone''s overlay applied if it belongs to a clone.'
      type: object
      additionalProperties: false
      required:
      - instance
      - template
      - version
      - spec
      properties:
        instance:
          type: string
        template:
          type: string
        version:
          type: integer
          minimum: 1
        clone:
          type: string
        spec:
          $ref: '#/components/schemas/AgentTemplateSpec'
    EntraIdentityBinding:
      title: EntraIdentityBinding
      description: Operator-controlled Entra identity management binding (FR-201).
        This configuration is not a public registry YAML kind or API resource. Contains
        no credential value; the first client-secret resolver is for local development
        acceptance only.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - bindingVersion
      - entraTenantId
      - blueprintAppId
      - blueprintObjectId
      - blueprintPrincipalId
      - sponsorUserIds
      - credentialRef
      - credentialVersion
      properties:
        tenantId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Internal Muistamo tenant ID. This is a separate identifier
            from the Entra directory.
        bindingVersion:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Immutable binding version. A changed directory, blueprint,
            sponsors or credential reference/version requires a new binding version.
        entraTenantId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Customer Entra directory ID; used in the fixed Microsoft token
            authority.
        blueprintAppId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Blueprint application ID, used for authentication and Graph
            agentIdentityBlueprintId.
        blueprintObjectId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Blueprint application object ID, retained for operator reconciliation.
        blueprintPrincipalId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Blueprint service principal object ID, retained for operator
            reconciliation.
        sponsorUserIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Explicit sponsor user object IDs. No directory-wide user search.
        credentialRef:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,99}$
          description: Opaque operator credential reference; never an inline credential,
            URL or filesystem path.
        credentialVersion:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{0,99}$
          description: Immutable version resolved with credentialRef. Token reuse
            is confined to this binding and credential version.
    EntraLifecycleRef:
      title: EntraLifecycleRef
      description: Opaque reference for new live lifecycle workflows and activities.
        Load identity mode, historical binding, person and current HR generation from
        the committed receipt; never carry HR email or provider credentials in this
        input.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - receiptId
      properties:
        tenantId:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
    EntraUserLink:
      title: EntraUserLink
      description: 'Which Entra user an HR person is, as the person''s latest live
        joiner found it: the user whose employeeId equals the HR person id, keyed
        by the user''s immutable object id. Requests made with an Entra token are
        matched to a person only through a matched link, never by name or email. unmatched:
        no user carries the id, or the HR id cannot be an Entra employeeId. ambiguous:
        more than one user carries it. conflict: the user also matched another person;
        neither person is linked until a later joiner finds them unambiguously. unavailable:
        the lookup was refused or failed, so no earlier link is kept. Only matched
        links carry entraUserObjectId.'
      type: object
      additionalProperties: false
      required:
      - personId
      - status
      - entraTenantId
      - receiptId
      - matchedAt
      properties:
        personId:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - matched
          - unmatched
          - ambiguous
          - conflict
          - unavailable
        entraUserObjectId:
          type: string
          format: uuid
        entraTenantId:
          type: string
          format: uuid
        receiptId:
          description: The HR receipt whose joiner recorded this outcome. A conflict
            found by another person's joiner keeps this person's receipt.
          type: string
          format: uuid
        matchedAt:
          description: When this outcome was recorded.
          type: string
          format: date-time
    EntryDecay:
      title: EntryDecay
      description: 'How recently a reviewer vouched for a pack entry (FR-307). current
        until dueAt; then due (still served, flagged and queued for the pack''s reviewers)
        until expiresAt; then expired, which is never served and is removed by the
        next decay sweep. Mandatory packs never expire: their entries stay due and
        are flagged to privacy officers.'
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - current
          - due
          - expired
        verifiedAt:
          description: Absent only if no reviewer ever confirmed the entry, which
            is then treated as unconfirmed (expired, or due in a mandatory pack).
          type: string
          format: date-time
        verifiedBy:
          type: string
        dueAt:
          type: string
          format: date-time
        expiresAt:
          description: Absent for mandatory packs, which never expire.
          type: string
          format: date-time
    EntryVerification:
      title: EntryVerification
      description: 'A pack entry and its decay state: an item in a reviewer''s re-verification
        queue, or the result of confirming an entry.'
      type: object
      additionalProperties: false
      required:
      - pack
      - version
      - entry
      - decay
      - provenance
      properties:
        pack:
          type: string
        version:
          type: string
        mandatory:
          type: boolean
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        decay:
          $ref: '#/components/schemas/EntryDecay'
        provenance:
          $ref: '#/components/schemas/Provenance'
    ErasureProof:
      title: ErasureProof
      description: What one service erased for a request, and what it kept and why.
        No raw subject identifiers are stored here; digests let an authorised caller
        confirm a known subject and prevent stale HR data from returning.
      type: object
      additionalProperties: false
      required:
      - id
      - service
      - completedAt
      - requestedBy
      - pseudonym
      - counts
      - retained
      - subjectDigest
      properties:
        id:
          type: string
          format: uuid
        service:
          type: string
          enum:
          - control-plane
          - knowledge
        completedAt:
          type: string
          format: date-time
        requestedBy:
          type: string
        pseudonym:
          description: What the person's identifiers were replaced with.
          type: string
        counts:
          description: Rows changed per data location, for example entries.contributor.
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        retained:
          type: array
          items:
            title: ErasureRetention
            type: object
            additionalProperties: false
            required:
            - data
            - reason
            properties:
              data:
                type: string
              reason:
                type: string
        warnings:
          type: array
          items:
            type: string
        hrFenceKeys:
          description: 'Control-plane erasure fence keys: tenant-scoped, namespaced
            one-way digests of known aliases and HR keys, retained with the erasure/idempotency
            proof. No raw email or HR key.'
          type: array
          items:
            type: string
            pattern: ^[0-9a-f]{64}$
        subjectDigest:
          description: SHA-256 (hex) over the tenant id and the sorted identifiers.
          type: string
          pattern: ^[0-9a-f]{64}$
    ErasureRequest:
      title: ErasureRequest
      description: Erase a person's data (GDPR Art 17, FR-309). The client chooses
        the id and sends the same request to every service; repeating it returns the
        stored proof.
      type: object
      additionalProperties: false
      required:
      - id
      - subject
      - reason
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: '#/components/schemas/PrivacySubject'
        reason:
          description: Why, for example the reference of the data subject's request.
          type: string
          minLength: 1
          maxLength: 2000
        redactEntries:
          description: 'Knowledge service only: entry revisions whose title and body
            are themselves personal data. They and every revision derived from them
            are redacted.'
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    EvidenceEvent:
      title: EvidenceEvent
      description: One signed, hash-chained evidence event. The hashed body and signature
        are defined in control-plane/evidencechain; verify chains with mst evidence
        verify.
      type: object
      additionalProperties: false
      required:
      - tenant
      - seq
      - occurredAt
      - actor
      - action
      - subject
      - before
      - after
      - requestId
      - prevHash
      - hash
      - keyId
      - signature
      properties:
        tenant:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        subject:
          title: EvidenceSubject
          type: object
          additionalProperties: false
          required:
          - kind
          - name
          properties:
            kind:
              type: string
            name:
              type: string
        before:
          description: State before the action, or null.
        after:
          description: State after the action, or null.
        requestId:
          type: string
        prevHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        keyId:
          type: string
          pattern: ^[0-9a-f]{32}$
        signature:
          description: Ed25519 signature over the hash bytes, base64.
          type: string
    EvidenceEventPage:
      title: EvidenceEventPage
      description: A page of the tenant's evidence chain, in seq order.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceEvent'
        nextAfterSeq:
          description: Pass as afterSeq for the next page. Absent on the last page.
          type: integer
    GatewayAuthorizationDecision:
      title: GatewayAuthorizationDecision
      description: Evidence-backed authorization, never proof of upstream execution.
        Identity fields exist only on allow. Cedar remains observation-only.
      type: object
      additionalProperties: false
      required:
      - allowed
      - reason
      - requestId
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - allowed
          - invalid-request
          - invalid-key
          - inactive-key
          - inactive-instance
          - identity-not-ready
          - person-not-established
          - alias-not-allowed
          - route-not-current
          - budget-reached
          - calls-without-usage-limit
          - rate-limited
          - too-many-in-flight
          - mcp-not-integrated
        requestId:
          type: string
          format: uuid
        keyId:
          type: string
          format: uuid
        instance:
          type: string
        person:
          description: 'Canonical development principal, dev: followed by the immutable
            user binding reference. This bounded slice does not establish an Entra
            OBO principal.'
          type: string
        costCentre:
          type: string
        policy:
          $ref: '#/components/schemas/PolicyDecision'
    GatewayAuthorizationRequest:
      title: GatewayAuthorizationRequest
      description: Normalized ext_authz attributes. Never persisted verbatim. The
        bearer secret is passed separately and never enters this contract or evidence.
        Protocol kind comes from the trusted listener.
      type: object
      additionalProperties: false
      required:
      - kind
      - method
      - path
      - metadataValid
      properties:
        kind:
          type: string
          enum:
          - model
          - mcp
        method:
          type: string
        path:
          type: string
        metadataValid:
          type: boolean
        alias:
          type: string
    GatewayAuthzConfig:
      title: GatewayAuthzConfig
      description: Trusted gateway/listener configuration for model authorization.
        Its SHA-256 fingerprint must match the parsed gRPC metadata in the gateway
        configuration. No provider credentials or customer content.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - models
      properties:
        tenantId:
          type: string
          format: uuid
        models:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/GatewayModelRoute'
    GatewayModelRoute:
      title: GatewayModelRoute
      description: An operator-pinned route; stale alias/model revisions or target
        mismatch refuse calls until both gateway and checker configuration are refreshed.
      type: object
      additionalProperties: false
      required:
      - alias
      - aliasRevision
      - catalogueName
      - modelRevision
      - provider
      - model
      - region
      - baseUrl
      properties:
        alias:
          type: string
          minLength: 1
        aliasRevision:
          type: integer
          minimum: 1
        catalogueName:
          type: string
          minLength: 1
        modelRevision:
          type: integer
          minimum: 1
        provider:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        credentialEnv:
          description: 'Name of the environment variable from which the gateway reads
            this route''s provider credential at runtime. A reference only, never
            a value: Muistamo never stores provider credentials (NFR-08). Only MUISTAMO_PROVIDER_KEY_*
            names, so a configuration can never send another gateway secret upstream.
            The pinned gateway refuses to start when the variable is unset.'
          type: string
          pattern: ^MUISTAMO_PROVIDER_KEY_[A-Z0-9_]{1,40}$
        baseUrl:
          description: Trusted operator-pinned deployment endpoint, without credentials,
            query or fragment. The later renderer must emit this exact target and
            the matching configuration fingerprint together. Not independent provider-region
            verification.
          type: string
          format: uri
    HREvent:
      title: HREvent
      description: A joiner or leaver event from the tenant's HR system, in Muistamo's
        own shape. HRIS connectors map their payloads onto this. Sent to POST /v1/hr/events
        with an HMAC signature.
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - occurredAt
      - person
      properties:
        id:
          description: 'The HR system''s event id. Re-sending the same id is safe:
            it is processed once.'
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum:
          - joiner
          - leaver
        occurredAt:
          type: string
          format: date-time
        person:
          title: HRPerson
          type: object
          additionalProperties: false
          required:
          - id
          - email
          - jobCode
          properties:
            id:
              description: Stable employee id in the HR system.
              type: string
              minLength: 1
              maxLength: 200
            email:
              type: string
              minLength: 3
            jobCode:
              type: string
              minLength: 1
            managerEmail:
              description: 'Leaver: the person''s manager, who decides what happens
                to their personal knowledge layer (E4.2). Without it the instance
                sponsor decides, then the tenant''s privacy officers.'
              type: string
              minLength: 3
    HREventAccepted:
      title: HREventAccepted
      description: The durable HR acceptance decision and workflow handoff. Ignored
        or cancelled events have no workflow ID. Generation is per tenant/person;
        legacy receipts use zero.
      type: object
      additionalProperties: false
      required:
      - eventId
      - workflowId
      - duplicate
      - decision
      - generation
      - dispatchState
      properties:
        eventId:
          type: string
        workflowId:
          description: Empty until a handoff succeeds, or when this event is ignored/cancelled.
          type: string
        decision:
          type: string
          enum:
          - accepted
          - ignored
          - legacy
        generation:
          type: integer
          format: int64
          minimum: 0
        dispatchState:
          type: string
          enum:
          - pending
          - dispatched
          - ignored
          - cancelled
          - legacy
        duplicate:
          description: True when this event id was already received.
          type: boolean
    HRIdentityRoute:
      title: HRIdentityRoute
      description: Receipt-pinned lifecycle route, loaded from committed tenant-scoped
        HR state. A worker environment flag cannot change this decision. Simulation
        has no binding; Entra requires its exact historical binding.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - receiptId
      - providerMode
      properties:
        tenantId:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
        providerMode:
          type: string
          enum:
          - simulated
          - entra
        bindingVersion:
          type: string
          format: uuid
    HealthStatus:
      title: HealthStatus
      description: Response body of every service health endpoint.
      type: object
      additionalProperties: false
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
    IdentityBindingStatus:
      title: IdentityBindingStatus
      description: Operator-only durable binding metadata. The full config, sponsor
        list and credential reference/value are not stored here; configDigest pins
        the exact validated EntraIdentityBinding. This is not a public YAML kind or
        administration endpoint.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - bindingVersion
      - configDigest
      - entraTenantId
      - blueprintAppId
      - createdAt
      properties:
        tenantId:
          type: string
          format: uuid
        bindingVersion:
          type: string
          format: uuid
        configDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        entraTenantId:
          type: string
          format: uuid
        blueprintAppId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    IdentityEnrollmentStatus:
      title: IdentityEnrollmentStatus
      description: Operator-only immutable enrollment of a fresh Muistamo tenant into
        the development Entra lifecycle. No credential value or complete binding configuration
        is stored here.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - bindingVersion
      - createdAt
      properties:
        tenantId:
          type: string
          format: uuid
        bindingVersion:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    IdentityOperationStatus:
      title: IdentityOperationStatus
      description: Operator-only Entra operation journal status. Identifiers are internal
        opaque IDs; no employee email, raw HR event key, credential or provider response
        body is stored. A pending or indeterminate create never grants permission
        for another blind POST.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - id
      - instanceIdentityId
      - bindingVersion
      - hrReceiptId
      - hrGeneration
      - action
      - attempt
      - state
      - creationId
      - createdAt
      - updatedAt
      properties:
        tenantId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        instanceIdentityId:
          type: string
          format: uuid
        bindingVersion:
          type: string
          format: uuid
        hrReceiptId:
          type: string
          format: uuid
        hrGeneration:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum:
          - create
          - enable
          - disable
          - delete
        attempt:
          type: integer
          format: int64
          minimum: 1
          description: Distinct provider request attempt for this HR generation/action.
            Corrective disables have their own intent/result; original uncertainties
            are never overwritten.
        state:
          type: string
          enum:
          - pending
          - succeeded
          - indeterminate
          - failed
        creationId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        candidateId:
          type: string
          format: uuid
        errorCode:
          type: string
          enum:
          - provider_refused
          - provider_unavailable
          - ownership_unproved
          - uncertain
          - generation_superseded
        resultEvidenceSeq:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    InstanceIdentityStatus:
      title: InstanceIdentityStatus
      description: Durable provider mode and ownership for one instance. observedState
        is the last verified provider observation, not an authorization or a claim
        of immediate token revocation. Trusted HR association uses an opaque receipt
        UUID, separate from editable document labels.
      type: object
      additionalProperties: false
      required:
      - tenantId
      - id
      - instanceName
      - providerMode
      - observedState
      - updatedAt
      properties:
        tenantId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        instanceName:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        providerMode:
          type: string
          enum:
          - simulated
          - entra
        bindingVersion:
          type: string
          format: uuid
        configDigest:
          type: string
          pattern: ^[0-9a-f]{64}$
        entraTenantId:
          type: string
          format: uuid
        assignmentReceiptId:
          type: string
          format: uuid
        providerId:
          type: string
          format: uuid
        creationId:
          type: string
          format: uuid
        observedState:
          type: string
          enum:
          - simulated
          - unprovisioned
          - disabled
          - enabled
          - deleted
          - reconciliation_required
        enabledGeneration:
          type: integer
          format: int64
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    InstanceState:
      title: InstanceState
      description: Lifecycle state of an agent instance (PRD section 5).
      type: string
      enum:
      - requested
      - active
      - under-review
      - suspended
      - retired
      - quarantined
    InstanceTransition:
      title: InstanceTransition
      description: Request to move an instance to another lifecycle state.
      type: object
      additionalProperties: false
      required:
      - to
      properties:
        to:
          $ref: '#/components/schemas/InstanceState'
    KnowledgeEntry:
      title: KnowledgeEntry
      description: An immutable entry revision.
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - type
      - title
      - body
      - dataClass
      - contributor
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        key:
          description: Stable key; the most specific layer wins for the same key.
          type: string
          pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
          maxLength: 120
        type:
          type: string
          enum:
          - skill
          - fact
          - example
        title:
          type: string
        body:
          type: string
        source:
          type: string
        dataClass:
          type: string
          enum:
          - public
          - internal
          - confidential
        contributor:
          type: string
        createdAt:
          type: string
          format: date-time
    KnowledgeEntryInput:
      title: KnowledgeEntryInput
      description: A new entry captured into the caller's personal layer.
      type: object
      additionalProperties: false
      required:
      - key
      - type
      - title
      - body
      properties:
        key:
          description: Stable key; the most specific layer wins for the same key.
          type: string
          pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
          maxLength: 120
        type:
          type: string
          enum:
          - skill
          - fact
          - example
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        source:
          description: Where this knowledge comes from (URL, document, person).
          type: string
          maxLength: 500
        dataClass:
          type: string
          enum:
          - public
          - internal
          - confidential
          default: internal
    KnowledgeEntryPage:
      title: KnowledgeEntryPage
      description: The caller's personal entries.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
    KnowledgePack:
      title: KnowledgePack
      description: A versioned, reviewed body of company knowledge (PRD section 5).
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgePack
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgePackSpec
          type: object
          additionalProperties: false
          required:
          - layer
          properties:
            layer:
              type: string
              enum:
              - company
              - role
              - team
              description: Personal layers are per person and are not packs.
            mandatory:
              description: 'Company packs only. Users and agents cannot switch a mandatory
                pack off or shadow its entries: for its keys it wins over every other
                layer. Only privacy officers can set or clear it, or change a mandatory
                pack in any other way.'
              type: boolean
            reviewers:
              type: array
              items:
                type: string
              description: People (actor names) who may approve or reject proposals
                and roll back versions.
              minItems: 1
            mergePolicy:
              title: MergePolicy
              type: object
              additionalProperties: false
              properties:
                requires:
                  type: array
                  items:
                    type: string
                    enum:
                    - review
                    - evaluation
            decay:
              title: DecayPolicy
              description: 'How long a reviewer''s confirmation of an entry lasts
                (FR-307). After reviewEveryDays the entry is due: still served, flagged
                and queued for the reviewers. After graceDays more it expires: never
                served, and removed from the pack by the next decay sweep. Mandatory
                packs never expire.'
              type: object
              additionalProperties: false
              properties:
                reviewEveryDays:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  default: 365
                graceDays:
                  type: integer
                  minimum: 0
                  maximum: 365
                  default: 30
            storageLocation:
              description: Customer-bound object storage location for pack content.
              type: string
          if:
            properties:
              mandatory:
                const: true
            required:
            - mandatory
          then:
            properties:
              layer:
                const: company
    KnowledgePackPage:
      title: KnowledgePackPage
      description: The tenant's packs.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePackRecord'
    KnowledgePackRecord:
      title: KnowledgePackRecord
      description: A pack definition and its latest content version.
      type: object
      additionalProperties: false
      required:
      - document
      - latestVersion
      - createdAt
      - updatedAt
      properties:
        document:
          $ref: '#/components/schemas/KnowledgePack'
        latestVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgePackRef:
      title: KnowledgePackRef
      description: A knowledge pack an agent uses, optionally constrained to a version
        range.
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
        version:
          description: Version constraint, for example 3.x to follow minor updates.
          type: string
    KnowledgeRead:
      title: KnowledgeRead
      description: 'One retrieval a person made: what they were shown, never the query
        text (invariant 5).'
      type: object
      additionalProperties: false
      required:
      - id
      - person
      - at
      - tool
      - resultCount
      - citations
      properties:
        id:
          type: string
          format: uuid
        person:
          type: string
        at:
          type: string
          format: date-time
        tool:
          type: string
          enum:
          - rest.retrieve
          - mcp.search_knowledge
        resultCount:
          type: integer
          minimum: 0
        citations:
          type: array
          items:
            title: ReadCitation
            type: object
            additionalProperties: false
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - entry
                - document
              entryKey:
                type: string
              layer:
                type: string
              pack:
                type: string
              version:
                type: string
              source:
                type: string
              externalId:
                type: string
    KnowledgeReadPage:
      title: KnowledgeReadPage
      description: The caller's own reads, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRead'
    KnowledgeSource:
      title: KnowledgeSource
      description: A document source attached to a pack (PRD section 10). Its documents
        are indexed, and every retrieval authorises each document live against the
        acting person's own rights at the source.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgeSource
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgeSourceSpec
          type: object
          additionalProperties: false
          required:
          - pack
          - connector
          properties:
            pack:
              description: The pack whose readers search this source.
              type: string
            connector:
              description: sharepoint is release 1's one source (not built yet). test
                is an in-memory connector for development and the adversarial suite,
                refused unless explicitly enabled.
              type: string
              enum:
              - sharepoint
              - test
            sharepoint:
              title: SharePointSourceConfig
              type: object
              additionalProperties: false
              required:
              - siteUrl
              properties:
                siteUrl:
                  type: string
            test:
              title: TestSourceConfig
              type: object
              additionalProperties: false
              required:
              - documents
              properties:
                documents:
                  type: array
                  maxItems: 500
                  items:
                    title: TestSourceDocument
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - title
                    - body
                    - readers
                    properties:
                      id:
                        type: string
                        minLength: 1
                      title:
                        type: string
                      body:
                        type: string
                      url:
                        type: string
                      readers:
                        description: Actor names who may open the document.
                        type: array
                        items:
                          type: string
    KnowledgeSourcePage:
      title: KnowledgeSourcePage
      description: The tenant's sources.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSourceRecord'
    KnowledgeSourceRecord:
      title: KnowledgeSourceRecord
      description: A source and its index state.
      type: object
      additionalProperties: false
      required:
      - document
      - documentCount
      - createdAt
      - updatedAt
      properties:
        document:
          $ref: '#/components/schemas/KnowledgeSource'
        documentCount:
          type: integer
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LeaverReview:
      title: LeaverReview
      description: The review of a leaver's personal knowledge layer (E4.2). While
        open, the layer is frozen. The decider merges chosen entries as a proposal,
        keeps the layer for one more period, or purges it; without a decision it is
        purged at the deadline.
      type: object
      additionalProperties: false
      required:
      - id
      - person
      - status
      - deciderKind
      - deadline
      - kept
      - entryCount
      - openedAt
      properties:
        id:
          type: string
        person:
          description: The leaver's identity.
          type: string
        status:
          type: string
          enum:
          - open
          - closed
        outcome:
          description: 'closed: merged (chosen entries proposed, the rest purged),
            purged, expired (purged at the deadline), cancelled (rehired; the layer
            is unfrozen) or empty (nothing to review).'
          type: string
          enum:
          - merged
          - purged
          - expired
          - cancelled
          - empty
        deciderKind:
          type: string
          enum:
          - manager
          - sponsor
          - privacy-officers
        decider:
          description: The deciding identity; absent when any privacy officer decides.
          type: string
        deadline:
          type: string
          format: date-time
        kept:
          description: The decider already extended the deadline once.
          type: boolean
        entryCount:
          type: integer
          minimum: 0
        proposalId:
          description: 'merged: the proposal the chosen entries became.'
          type: string
          format: uuid
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
        entries:
          description: 'Only on GET of one review, to its decider: the leaver''s personal
            entries.'
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
    LeaverReviewDecision:
      title: LeaverReviewDecision
      description: The decider's choice. merge proposes the chosen entries to a pack
        (normal review applies, and the decider cannot approve it) and purges the
        rest; keep extends the deadline once; purge deletes the layer now.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - merge
          - keep
          - purge
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        pack:
          description: 'merge: the pack to propose to.'
          type: string
        entryIds:
          description: 'merge: the leaver''s entries to propose.'
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        summary:
          description: 'merge: the proposal summary.'
          type: string
          minLength: 1
          maxLength: 2000
      if:
        properties:
          decision:
            const: merge
      then:
        required:
        - pack
        - entryIds
        - summary
      else:
        not:
          anyOf:
          - required:
            - pack
          - required:
            - entryIds
          - required:
            - summary
    LeaverReviewOpen:
      title: LeaverReviewOpen
      description: 'Sent by the control plane''s leaver workflow, signed with the
        tenant''s service secret: open the review of a leaver''s personal knowledge
        layer and freeze it. Repeating an id is safe.'
      type: object
      additionalProperties: false
      required:
      - id
      - person
      - deciders
      properties:
        id:
          description: 'The leaver workflow''s id and run id: unique per leaving,
            stable across retries.'
          type: string
          minLength: 1
          maxLength: 255
        person:
          title: LeaverReviewPerson
          type: object
          additionalProperties: false
          required:
          - email
          properties:
            email:
              type: string
              minLength: 3
            hrPersonId:
              type: string
              minLength: 1
              maxLength: 200
        deciders:
          description: 'Candidate deciders in order of preference: the manager, then
            instance sponsors. The first who is not the leaver decides; with none,
            the tenant''s privacy officers do.'
          type: array
          items:
            title: LeaverReviewDecider
            type: object
            additionalProperties: false
            required:
            - email
            - kind
            properties:
              email:
                type: string
                minLength: 3
              kind:
                type: string
                enum:
                - manager
                - sponsor
    LeaverReviewPage:
      title: LeaverReviewPage
      description: The reviews the caller decides, open first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LeaverReview'
    ModelAlias:
      title: ModelAlias
      description: A name templates use for a model, for example reasoning-default
        (PRD section 5, FR-602). It can target only an approved catalogue model, and
        changing its target is a rollout, never an edit.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: ModelAlias
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: ModelAliasSpec
          type: object
          additionalProperties: false
          required:
          - target
          properties:
            target:
              description: The catalogue model's name. Set on create; change it with
                a rollout.
              type: string
              pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            description:
              type: string
    ModelAliasPage:
      title: ModelAliasPage
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelAliasRecord'
    ModelAliasRecord:
      title: ModelAliasRecord
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      - compliant
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/ModelAlias'
        compliant:
          description: 'The target exists and is approved: templates using the alias
            can be published and assigned.'
          type: boolean
        reason:
          type: string
    ModelApproval:
      title: ModelApproval
      description: Where a catalogue model's approval stands. A change to the model's
        document resets it to pending.
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - revoked
        decidedBy:
          type: string
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    ModelApprovalDecision:
      title: ModelApprovalDecision
      description: A privacy officer's decision on a catalogue model; never the person
        who last changed it.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          - revoke
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ModelCatalogueItem:
      title: ModelCatalogueItem
      description: A provider model the company may use (PRD section 5, FR-601). Aliases
        can target it only once a privacy officer approves it, and any change to it
        needs approval again.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: ModelCatalogueItem
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: ModelCatalogueItemSpec
          type: object
          additionalProperties: false
          required:
          - provider
          - model
          - region
          - termsRef
          - priceSheet
          properties:
            provider:
              description: For example anthropic, google, openai, mistral.
              type: string
              minLength: 1
            model:
              description: The provider's model id.
              type: string
              minLength: 1
            version:
              type: string
            region:
              description: Where the provider processes requests, for example eu-west-1.
              type: string
              minLength: 1
            termsRef:
              description: Reference to the reviewed provider terms.
              type: string
              minLength: 1
            dpaRef:
              description: Reference to the data processing agreement (GDPR Art 28).
              type: string
            subProcessors:
              type: array
              items:
                type: string
            aiActProviderStatus:
              description: The provider's status under the EU AI Act, for example
                gpai-provider.
              type: string
            priceSheet:
              title: ModelPriceSheet
              description: Provider list prices, passed through at cost (invariant
                7).
              type: object
              additionalProperties: false
              required:
              - currency
              - inputPerMTok
              - outputPerMTok
              properties:
                currency:
                  type: string
                  const: EUR
                inputPerMTok:
                  type: number
                  minimum: 0
                outputPerMTok:
                  type: number
                  minimum: 0
                cachedInputPerMTok:
                  type: number
                  minimum: 0
    ModelCatalogueItemPage:
      title: ModelCatalogueItemPage
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelCatalogueItemRecord'
    ModelCatalogueItemRecord:
      title: ModelCatalogueItemRecord
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      - approval
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/ModelCatalogueItem'
        approval:
          $ref: '#/components/schemas/ModelApproval'
    Money:
      title: Money
      description: An exact amount. A decimal string, never a binary float, so billed
        costs and budgets are exact (invariant 7). EUR only while model price sheets
        are EUR only.
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,12})?$
        currency:
          type: string
          const: EUR
    ObjectMeta:
      title: ObjectMeta
      description: Metadata shared by every Muistamo YAML kind.
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          description: Unique name of the object within its tenant.
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        owner:
          description: Owning team or person reference.
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    PackEntry:
      title: PackEntry
      description: An entry in a pack version, with lineage.
      type: object
      additionalProperties: false
      required:
      - entry
      - proposal
      - reviewer
      properties:
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        proposal:
          description: The proposal that merged it.
          type: string
          format: uuid
        reviewer:
          type: string
    PackVersion:
      title: PackVersion
      description: An immutable version of a pack's content.
      type: object
      additionalProperties: false
      required:
      - pack
      - version
      - reason
      - createdBy
      - createdAt
      - entries
      properties:
        pack:
          type: string
        version:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
        parent:
          type: string
        reason:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PackEntry'
    PackVersionPage:
      title: PackVersionPage
      description: A pack's versions, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackVersion'
    PolicyDecision:
      title: PolicyDecision
      description: 'The policy engine''s answer. Release 1 runs in observe mode: nothing
        is enforced yet (the gateway is not built), so enforced is always false and
        wouldBlock says what enforcement would do.'
      type: object
      additionalProperties: false
      required:
      - decision
      - wouldBlock
      - monitored
      - mode
      - enforced
      - reason
      - matchedRules
      - checked
      - notEvaluated
      properties:
        decision:
          description: What the rules say.
          type: string
          enum:
          - allow
          - deny
        wouldBlock:
          description: 'Whether enforcement would block this: a denial, unless the
            denying ActionPolicy is in monitor mode.'
          type: boolean
        monitored:
          description: 'A monitor rule matched, or a monitor-mode policy denied: the
            request is flagged for review.'
          type: boolean
        policyMode:
          description: 'action: the mode of the ActionPolicy for the agent, if one
            exists.'
          type: string
          enum:
          - enforce
          - monitor
        mode:
          type: string
          const: observe
        enforced:
          type: boolean
          const: false
        reason:
          description: A plain-language explanation.
          type: string
        matchedRules:
          description: 'The rules that decided: the allowing ones for an allow, the
            denying ones for a deny. Empty for a denial by default.'
          type: array
          items:
            $ref: '#/components/schemas/PolicyRuleRef'
        checked:
          description: The parts of the effective permission that were evaluated.
          type: array
          items:
            type: string
        notEvaluated:
          description: Parts of the effective permission that release 1 cannot evaluate
            yet.
          type: array
          items:
            type: string
    PolicyDecisionRequest:
      title: PolicyDecisionRequest
      description: 'A question for the policy engine: may this agent call that one
        (kind call), or take this tool action (kind action)? Agents are named by template
        in release 1.'
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - call
          - action
        from:
          description: 'call: the calling template.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        fromClone:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          description: 'call: the caller''s clone, if it is one; it must be a clone
            of from.'
        to:
          description: 'call: the called template.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        toClone:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          description: 'call: the callee''s clone, if it is one; it must be a clone
            of to.'
        skill:
          description: 'call: the skill of the called agent being used.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
        dataClasses:
          description: 'call: every data class the call carries (none if omitted).'
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
        depth:
          description: 'call: position in the delegation chain; 1 (the default) is
            a direct call.'
          type: integer
          minimum: 1
          maximum: 100
        actFor:
          description: 'call: whose access the called agent uses (default same-user).'
          type: string
          enum:
          - same-user
          - service
        agent:
          description: 'action: the template taking the action.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        agentClone:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
          description: 'action: the agent''s clone, if it is one; it must be a clone
            of agent.'
        action:
          description: 'action: the tool action, for example email.send.'
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}(\.[a-z0-9_-]{1,63}){0,3}$
        attributes:
          description: 'action: facts about the request that rules can test, for example
            recipients.allInternal.'
          type: object
          propertyNames:
            pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}(\.[A-Za-z][A-Za-z0-9_]{0,63}){0,3}$
          additionalProperties:
            type: boolean
      allOf:
      - if:
          properties:
            kind:
              const: call
        then:
          required:
          - from
          - to
          - skill
          not:
            anyOf:
            - required:
              - agent
            - required:
              - action
            - required:
              - attributes
            - required:
              - agentClone
      - if:
          properties:
            kind:
              const: action
        then:
          required:
          - agent
          - action
          not:
            anyOf:
            - required:
              - from
            - required:
              - to
            - required:
              - skill
            - required:
              - dataClasses
            - required:
              - depth
            - required:
              - actFor
            - required:
              - fromClone
            - required:
              - toClone
    PolicyRuleRef:
      title: PolicyRuleRef
      description: One compiled Cedar policy and the document it came from.
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - effect
      properties:
        id:
          description: The Cedar policy id, for example link/analyst-intern-to-market-data
            or action-policy/analyst-intern-actions/rule/2.
          type: string
        kind:
          type: string
          enum:
          - AgentLink
          - ActionPolicy
        name:
          description: metadata.name of the source document.
          type: string
        rule:
          description: 'ActionPolicy: the 1-based index of the rule; absent for the
            policy''s default.'
          type: integer
          minimum: 1
        effect:
          type: string
          enum:
          - allow
          - deny
          - monitor
        target:
          description: 'Whom the rule names: template:<name> (covering its clones)
            or clone:<name>.'
          type: string
    PolicySimulation:
      title: PolicySimulation
      description: The same request decided under the current and the proposed rules.
      type: object
      additionalProperties: false
      required:
      - current
      - proposed
      - changed
      properties:
        current:
          $ref: '#/components/schemas/PolicyDecision'
        proposed:
          $ref: '#/components/schemas/PolicyDecision'
        changed:
          description: Whether the decision or wouldBlock differs.
          type: boolean
    PolicySimulationRequest:
      title: PolicySimulationRequest
      description: Decide a request under the current rules and under proposed ones.
        A proposed document replaces the current one of the same kind and name, or
        is added. Nothing is stored and no evidence is written.
      type: object
      additionalProperties: false
      required:
      - request
      properties:
        request:
          $ref: '#/components/schemas/PolicyDecisionRequest'
        links:
          type: array
          items:
            $ref: '#/components/schemas/AgentLink'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ActionPolicy'
    PrivacySubject:
      title: PrivacySubject
      description: The person an erasure or access request is about, by every identifier
        Muistamo may hold for them.
      type: object
      additionalProperties: false
      required:
      - identities
      - email
      properties:
        identities:
          description: Actor identities exactly as Muistamo records them, for example
            dev:person-a@example.invalid.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 3
            maxLength: 320
        email:
          type: string
          minLength: 3
          maxLength: 320
        hrPersonId:
          description: The HR system's person id, if the person came through HR events.
          type: string
          minLength: 1
          maxLength: 128
    Problem:
      title: Problem
      description: Error body (RFC 9457 problem details).
      type: object
      required:
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Proposal:
      title: Proposal
      description: A proposal of entries to a pack, with check results and the decision.
      type: object
      additionalProperties: false
      required:
      - id
      - pack
      - contributor
      - summary
      - status
      - entries
      - checks
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        pack:
          type: string
        contributor:
          type: string
        proposedBy:
          description: Set when someone proposed on the contributor's behalf (a leaver's
            decider, E4.2). They cannot decide the proposal.
          type: string
        summary:
          type: string
        status:
          type: string
          enum:
          - checks-failed
          - in-review
          - approved
          - rejected
        entries:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        decision:
          $ref: '#/components/schemas/ProposalDecisionRecord'
        mergedVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    ProposalDecision:
      title: ProposalDecision
      description: A reviewer's decision on a proposal.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        edits:
          description: 'Approve with edits: replacement bodies by entry key.'
          type: array
          items:
            title: EntryEdit
            type: object
            additionalProperties: false
            required:
            - key
            - body
            properties:
              key:
                description: Stable key; the most specific layer wins for the same
                  key.
                type: string
                pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
                maxLength: 120
              body:
                type: string
                minLength: 1
                maxLength: 20000
    ProposalDecisionRecord:
      title: ProposalDecisionRecord
      description: The reviewer's decision.
      type: object
      additionalProperties: false
      required:
      - reviewer
      - decision
      - reason
      - decidedAt
      properties:
        reviewer:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    ProposalInput:
      title: ProposalInput
      description: Propose personal entries to a pack.
      type: object
      additionalProperties: false
      required:
      - pack
      - entryIds
      - summary
      properties:
        pack:
          type: string
        entryIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        summary:
          type: string
          minLength: 1
          maxLength: 2000
    ProposalPage:
      title: ProposalPage
      description: Proposals visible to the caller.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
    Provenance:
      title: Provenance
      description: 'How much to trust an entry, as a 0-100 score and the factors that
        make it up (FR-307). Informational: it does not change ranking. reviewed +40
        (merged through a reviewed proposal), source +20 (names where it comes from),
        reviewer-edited +10 (the reviewer corrected it at merge), freshness +30 current,
        +10 due, 0 expired.'
      type: object
      additionalProperties: false
      required:
      - score
      - factors
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        factors:
          type: array
          items:
            title: ProvenanceFactor
            type: object
            additionalProperties: false
            required:
            - factor
            - points
            properties:
              factor:
                type: string
                enum:
                - reviewed
                - source
                - reviewer-edited
                - freshness
              points:
                type: integer
                minimum: 0
    ResolvedEntry:
      title: ResolvedEntry
      description: An effective entry for the caller, and where it came from.
      type: object
      additionalProperties: false
      required:
      - entry
      - layer
      properties:
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        layer:
          type: string
          enum:
          - personal
          - team
          - role
          - company
        pack:
          type: string
        version:
          type: string
        mandatory:
          description: The entry comes from a mandatory pack, so no other layer can
            replace it.
          type: boolean
        decay:
          description: 'Pack entries only: when a reviewer last vouched for it. Expired
            entries are never resolved.'
          $ref: '#/components/schemas/EntryDecay'
        provenance:
          $ref: '#/components/schemas/Provenance'
        overrides:
          description: Entries with the same key that this mandatory entry overrides,
            for example the caller's own personal entry.
          type: array
          items:
            title: ResolvedOverride
            type: object
            additionalProperties: false
            required:
            - layer
            properties:
              layer:
                type: string
                enum:
                - personal
                - team
                - role
                - company
              pack:
                type: string
    ResolvedEntryPage:
      title: ResolvedEntryPage
      description: The caller's effective knowledge.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedEntry'
    RetrievalResult:
      title: RetrievalResult
      description: Results the caller may see, each cited, and which sources were
        consulted.
      type: object
      additionalProperties: false
      required:
      - query
      - items
      - coverage
      properties:
        query:
          type: string
        items:
          type: array
          items:
            title: RetrievalItem
            type: object
            additionalProperties: false
            required:
            - title
            - snippet
            - score
            - citation
            properties:
              title:
                type: string
              snippet:
                type: string
              score:
                type: number
              citation:
                $ref: '#/components/schemas/Citation'
              decay:
                description: Pack entries only.
                $ref: '#/components/schemas/EntryDecay'
              provenance:
                description: Knowledge entries only; documents carry their source's
                  own metadata.
                $ref: '#/components/schemas/Provenance'
        coverage:
          title: RetrievalCoverage
          type: object
          additionalProperties: false
          required:
          - sourcesQueried
          - sourcesUnavailable
          - testConnectors
          properties:
            sourcesQueried:
              type: array
              items:
                type: string
            sourcesUnavailable:
              description: Sources whose authorisation failed; their documents were
                withheld, never returned unchecked.
              type: array
              items:
                type: string
            testConnectors:
              description: Sources served by the in-memory test connector, not a real
                system.
              type: array
              items:
                type: string
    RollbackInput:
      title: RollbackInput
      description: Publish a new version with an earlier version's content.
      type: object
      additionalProperties: false
      required:
      - toVersion
      - reason
      properties:
        toVersion:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    RollbackRequest:
      title: RollbackRequest
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    Rollout:
      title: Rollout
      description: 'One model switch of an alias (PRD section 5): its audit record.'
      type: object
      additionalProperties: false
      required:
      - id
      - alias
      - from
      - to
      - strategy
      - evaluation
      - status
      - createdBy
      - createdAt
      - reason
      properties:
        id:
          type: string
          format: uuid
        alias:
          type: string
        from:
          type: string
        to:
          type: string
        strategy:
          description: immediate in release 1; canary is release 2 (FR-604).
          type: string
          enum:
          - immediate
        evaluation:
          title: RolloutEvaluation
          type: object
          additionalProperties: false
          required:
          - status
          - reason
          properties:
            status:
              type: string
              enum:
              - not-run
            reason:
              type: string
        status:
          type: string
          enum:
          - completed
          - rolled-back
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        reason:
          type: string
        rolledBackBy:
          type: string
        rolledBackAt:
          type: string
          format: date-time
        rollbackReason:
          type: string
    RolloutPage:
      title: RolloutPage
      description: Rollouts, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rollout'
    RolloutRequest:
      title: RolloutRequest
      description: Switch an alias to another approved model. The evaluation gate
        (FR-603) needs the gateway, which does not exist yet, so the switch is unevaluated
        and must be acknowledged as such.
      type: object
      additionalProperties: false
      required:
      - to
      - reason
      - acknowledgeUnevaluated
      properties:
        to:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        acknowledgeUnevaluated:
          description: 'Must be true: the switch is made without an evaluation report.'
          type: boolean
          const: true
    SyncResult:
      title: SyncResult
      description: What a sync changed in the index.
      type: object
      additionalProperties: false
      required:
      - source
      - indexed
      - removed
      - total
      properties:
        source:
          type: string
        indexed:
          type: integer
        removed:
          type: integer
        total:
          type: integer
    UsagePage:
      title: UsagePage
      description: Authorized gateway calls in a period, newest first, metered or
        not.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsageRecord'
        next:
          description: Cursor for the next page; absent on the last page.
          type: string
    UsageRecord:
      title: UsageRecord
      description: A call the gateway's check authorized, and what it cost at provider
        prices. metered is false while no usage has arrived; see metered for what
        an unmetered call means. Unmetered calls are reported, never estimated.
      type: object
      additionalProperties: false
      required:
      - requestId
      - keyId
      - instance
      - person
      - kind
      - authorizedAt
      properties:
        requestId:
          type: string
          format: uuid
        keyId:
          type: string
          format: uuid
        instance:
          type: string
        person:
          type: string
        costCentre:
          type: string
        kind:
          type: string
          enum:
          - model
          - mcp
        alias:
          type: string
        provider:
          type: string
        model:
          description: The provider's model id the alias resolved to when authorized.
          type: string
        mcpMethod:
          type: string
        mcpTool:
          type: string
        authorizedAt:
          type: string
          format: date-time
        metered:
          description: 'Model calls only: false while no usage record exists. Within
            15 minutes of authorization this is normal (usage is still arriving);
            after that the call is unmetered: its cost is unknown and may have been
            incurred (it may not have run, may have run without reporting usage, or
            its usage was lost in export or refused by ingest). Unmetered calls are
            reported, never estimated. Absent for MCP calls, which carry no tokens.'
          type: boolean
        failedStatus:
          description: 'Model calls only: the HTTP status when the gateway or provider
            answered the call with an error (4xx or 5xx). Providers normally do not
            bill errors, so no cost is recorded.'
          type: integer
          minimum: 400
          maximum: 599
        usageMissing:
          description: 'Model calls only: true when the gateway reported that the
            call ran but sent no usage (for example a call the client aborted). Its
            cost is unknown and likely incurred; it counts toward the key''s maxCallsWithoutUsage
            allowance.'
          type: boolean
        inputTokens:
          type: integer
          minimum: 0
        cachedInputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        cost:
          description: At provider cost from the price snapshot taken when authorized;
            no markup.
          $ref: '#/components/schemas/Money'
        recordedAt:
          type: string
          format: date-time
      if:
        properties:
          kind:
            const: model
      then:
        required:
        - metered
    VerificationInput:
      title: VerificationInput
      description: A reviewer confirms the immutable entry revision they inspected,
        restarting its decay clock. A replaced revision is refused with 409.
      type: object
      additionalProperties: false
      required:
      - entryId
      - reason
      properties:
        entryId:
          type: string
          format: uuid
          description: The immutable entry ID shown to the reviewer; never silently
            confirm a replacement with the same key.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    VerificationPage:
      title: VerificationPage
      description: Entries due or expired in packs the caller may confirm, soonest
        to expire first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntryVerification'
    VirtualKey:
      title: VirtualKey
      description: A gateway virtual key, without its secret. A key is usable while
        active, unexpired and its instance is active; revocation is final.
      type: object
      additionalProperties: false
      required:
      - id
      - instance
      - aliases
      - monthlyBudget
      - maxCallsWithoutUsage
      - maxRequestsPerMinute
      - maxCallsInFlight
      - status
      - createdAt
      - createdBy
      properties:
        id:
          type: string
          format: uuid
        instance:
          type: string
        aliases:
          type: array
          items:
            type: string
        monthlyBudget:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
        status:
          description: active and unexpired keys are usable (while the instance is
            active); expired is derived from expiresAt and never stored; revocation
            is final.
          type: string
          enum:
          - active
          - expired
          - revoked
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        revokedAt:
          type: string
          format: date-time
        revokedBy:
          type: string
        maxCallsWithoutUsage:
          description: How many of the key's calls within a rolling 24 hours may run
            without a usage report (aborted, or unaccounted after 15 minutes); once
            more have, calls are refused. Calls in flight can overshoot it.
          type: integer
          minimum: 0
          maximum: 1000
        maxRequestsPerMinute:
          description: Calls the key may make within any rolling minute.
          type: integer
          minimum: 1
          maximum: 6000
        maxCallsInFlight:
          description: Model calls the key may have in flight at once.
          type: integer
          minimum: 1
          maximum: 100
        revokeReason:
          description: 'A fixed revocation reason code, never free text: operator,
            compromised, rotation or leaver (administrators), leaver (the leaver workflow),
            or reactivation (keys from before a suspension, revoked when the instance
            becomes active again).'
          type: string
    VirtualKeyIssued:
      title: VirtualKeyIssued
      description: A newly issued key and its secret. The secret is returned only
        here, once; Muistamo keeps only its SHA-256 and can never show it again.
      type: object
      additionalProperties: false
      required:
      - key
      - secret
      properties:
        key:
          $ref: '#/components/schemas/VirtualKey'
        secret:
          description: mvk_<key id>_<43 base64url characters encoding 32 random bytes>.
            Send as a bearer token to the gateway. Muistamo stores SHA-256 of the
            32 decoded bytes.
          type: string
          pattern: ^mvk_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
    VirtualKeyPage:
      title: VirtualKeyPage
      description: Virtual keys, newest first, never with secrets.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VirtualKey'
        next:
          description: Cursor for the next page; absent on the last page.
          type: string
    VirtualKeyRequest:
      title: VirtualKeyRequest
      description: 'Issue a gateway virtual key to an active agent instance (FR-702,
        E6.1). MVP: only operator-appointed gateway administrators may manage keys.
        Verified owner/sponsor self-service is deferred. The secret is shown once
        in the response and never stored.'
      type: object
      additionalProperties: false
      required:
      - instance
      - aliases
      - monthlyBudget
      properties:
        instance:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        aliases:
          description: Model aliases the key may call; each must be one the instance's
            template allows.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        monthlyBudget:
          description: Calls are refused once the recorded spend of calls authorized
            in the current UTC calendar month reaches it. Calls in flight can overshoot;
            the overshoot is reported, not hidden.
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
        maxCallsWithoutUsage:
          description: 'How many of the key''s calls within a rolling 24 hours may
            run without a usage report: a call the client aborted (the provider likely
            bills it, but the gateway reports no usage), or one still unaccounted
            15 minutes after authorization. Once more have, calls are refused until
            enough fall out of the window. Calls in flight when the limit is reached
            can overshoot it. Omitted means 10; 0 refuses the key after the first
            such call. Fixed at issuance.'
          type: integer
          minimum: 0
          maximum: 1000
        maxRequestsPerMinute:
          description: Calls the key may make within any rolling minute; more are
            refused with HTTP 429. Omitted means 60. Fixed at issuance.
          type: integer
          minimum: 1
          maximum: 6000
        maxCallsInFlight:
          description: Model calls the key may have in flight at once (authorized,
            with no usage, missing-usage or failure report yet, within 15 minutes);
            more are refused with HTTP 429. Bounds how far budgets can be overshot
            (calls older than 15 minutes leave this count and count toward maxCallsWithoutUsage
            instead, so the overshoot bound is the two together). Omitted means 4.
            Fixed at issuance.
          type: integer
          minimum: 1
          maximum: 100
    VirtualKeyRevocation:
      title: VirtualKeyRevocation
      description: 'Revoke a key. Final: a revoked key never becomes active again.'
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          description: A fixed reason code; personal data and secrets must never enter
            retained revocation records.
          type: string
          enum:
          - operator
          - compromised
          - rotation
          - leaver
