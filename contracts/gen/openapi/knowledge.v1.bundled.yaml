# GENERATED by contracts/bundle.py from contracts/openapi and contracts/schemas.
openapi: 3.1.0
info:
  title: Muistamo knowledge API
  version: 0.1.0
  description: 'The knowledge service: packs, the personal layer, proposals, review,
    versions and layer resolution. Schemas live in ../schemas and are referenced,
    never copied. Every call is scoped to one tenant and one acting person; until
    real authentication exists both come from development-only headers that are disabled
    by default.'
servers:
- url: http://localhost:8001
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/knowledge/packs:
