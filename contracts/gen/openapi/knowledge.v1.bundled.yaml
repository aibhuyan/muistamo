        schema:
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: A page of evidence events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceEventPage'
        default:
          $ref: '#/components/responses/Problem'
  /mcp/knowledge:
    post:
      operationId: mcpKnowledge
      summary: Muistamo MCP server (streamable HTTP, stateless)
      description: Tools search_knowledge, remember and propose_knowledge. The caller
        is resolved from each request exactly as for the REST API; unresolvable callers
        get 401 before the MCP layer. Tool inputs follow knowledgeentryinput and proposalinput.
      responses:
        '200':
          description: An MCP JSON-RPC response.
        '401':
          $ref: '#/components/responses/Problem'
