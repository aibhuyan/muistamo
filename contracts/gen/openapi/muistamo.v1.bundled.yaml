# GENERATED by contracts/bundle.py from contracts/openapi and contracts/schemas.
openapi: 3.1.0
info:
  title: Muistamo API
  version: 0.1.0
  description: Control-plane API. Schemas live in ../schemas and are referenced, never
    copied. Every /v1 call is scoped to one tenant; until real authentication exists
    the tenant comes from a development-only header that is disabled by default.
servers:
- url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/templates:
    get:
      operationId: listTemplates
      summary: List the latest version of every template
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTemplatePage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/templates/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      operationId: getTemplate
      summary: Get the latest version of a template
      responses:
        '200':
          $ref: '#/components/responses/TemplateRecord'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: applyTemplate
      summary: Apply a template; a changed document creates a new immutable version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTemplate'
      responses:
        '200':
          $ref: '#/components/responses/TemplateRecord'
        '201':
          $ref: '#/components/responses/TemplateRecord'
        default:
          $ref: '#/components/responses/Problem'
  /v1/templates/{name}/versions/{version}:
    parameters:
    - $ref: '#/components/parameters/Name'
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      operationId: getTemplateVersion
      summary: Get one version of a template
      responses:
        '200':
          $ref: '#/components/responses/TemplateRecord'
        default:
          $ref: '#/components/responses/Problem'
  /v1/templates/{name}/versions/{version}/publication:
    parameters:
    - $ref: '#/components/parameters/Name'
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    post:
      operationId: requestPublication
      summary: Ask for this template version to be published to the catalogue
      responses:
        '201':
          $ref: '#/components/responses/CatalogueRequest'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalogue:
    get:
      operationId: listCatalogue
      summary: Template versions published to the catalogue (assignable to joiners)
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueEntryPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalogue/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    delete:
      operationId: withdrawFromCatalogue
      summary: Withdraw a template; new joiners stop receiving it, existing instances
        are untouched
      responses:
        '204':
          description: Withdrawn.
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalogue/requests:
    get:
      operationId: listCatalogueRequests
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - published
          - rejected
          - withdrawn
          - superseded
      responses:
        '200':
          description: Requests, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogueRequestPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/catalogue/requests/{id}/decision:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: decideCatalogueRequest
      summary: Approve or reject (catalogue approvers only; never the requester, never
        twice)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogueDecision'
      responses:
        '200':
          $ref: '#/components/responses/CatalogueRequest'
        default:
          $ref: '#/components/responses/Problem'
  /v1/instances:
    get:
      operationId: listInstances
      summary: List instances
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInstancePage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/instances/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      operationId: getInstance
      summary: Get an instance
      responses:
        '200':
          $ref: '#/components/responses/InstanceRecord'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: applyInstance
      summary: Create an instance, or update its sponsor, delegate and cost centre
      description: Creating requires spec.state = requested and no If-Match. Updating
        requires If-Match with the current ETag; state changes go through transitions.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInstance'
      responses:
        '200':
          $ref: '#/components/responses/InstanceRecord'
        '201':
          $ref: '#/components/responses/InstanceRecord'
        default:
          $ref: '#/components/responses/Problem'
  /v1/instances/{name}/transitions:
    parameters:
    - $ref: '#/components/parameters/Name'
    post:
      operationId: transitionInstance
      summary: Move an instance to another lifecycle state
      description: Requires If-Match with the current ETag; without it the response
        is 428.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceTransition'
      responses:
        '200':
          $ref: '#/components/responses/InstanceRecord'
        default:
          $ref: '#/components/responses/Problem'
  /v1/links:
    get:
      operationId: listLinks
      summary: List every agent link
      responses:
        '200':
          description: The tenant's links, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLinkPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/links/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      operationId: getLink
      responses:
        '200':
          $ref: '#/components/responses/LinkRecord'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: applyLink
      summary: Create or change an agent link; an identical document changes nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentLink'
      responses:
        '200':
          $ref: '#/components/responses/LinkRecord'
        '201':
          $ref: '#/components/responses/LinkRecord'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteLink
      summary: Remove a link; calls it allowed are denied from then on
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Problem'
  /v1/action-policies:
    get:
      operationId: listActionPolicies
      summary: List every action policy
      responses:
        '200':
          description: The tenant's action policies, by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionPolicyPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/action-policies/{name}:
    parameters:
    - $ref: '#/components/parameters/Name'
    get:
      operationId: getActionPolicy
      responses:
        '200':
          $ref: '#/components/responses/ActionPolicyRecord'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: applyActionPolicy
      summary: Create or change an action policy; at most one applies to a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPolicy'
      responses:
        '200':
          $ref: '#/components/responses/ActionPolicyRecord'
        '201':
          $ref: '#/components/responses/ActionPolicyRecord'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteActionPolicy
      summary: Remove an action policy; the template's actions are denied by default
        from then on
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Problem'
  /v1/policy/decisions:
    post:
      operationId: decidePolicy
      summary: Decide an agent call or tool action (observe mode; recorded as evidence)
      description: 'Evaluates the tenant''s links and action policies, compiled to
        Cedar. Deny by default; deny overrides allow. Release 1 enforces nothing:
        the answer says what enforcement would do, and every decision is recorded
        as a signed policy.decision event.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyDecisionRequest'
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecision'
        default:
          $ref: '#/components/responses/Problem'
  /v1/policy/simulate:
    post:
      operationId: simulatePolicy
      summary: Decide a request under the current and proposed rules, changing nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySimulationRequest'
      responses:
        '200':
          description: Both decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySimulation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/policy/cedar:
    get:
      operationId: getCompiledPolicies
      summary: The Cedar policy set the tenant's rules compile to
      responses:
        '200':
          description: The compiled policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompiledPolicies'
        default:
          $ref: '#/components/responses/Problem'
  /v1/privacy/erasures:
    post:
      operationId: erasePersonalData
      summary: Erase a person's data (privacy officers only); repeating an id returns
        the stored proof
      description: Deletes the person's own data, replaces their identifiers with
        a pseudonym where records must stay (lineage, published history), and records
        a signed privacy.erasure.completed event. Evidence events are retained under
        GDPR Art 17(3); the proof says so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequest'
      responses:
        '200':
          description: This id was already completed; the stored proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureProof'
        '201':
          description: Erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureProof'
        default:
          $ref: '#/components/responses/Problem'
  /v1/privacy/erasures/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getErasure
      summary: The proof of a completed erasure (privacy officers only)
      responses:
        '200':
          description: The proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureProof'
        default:
          $ref: '#/components/responses/Problem'
  /v1/privacy/access:
    post:
      operationId: exportPersonalData
      summary: Export everything held about a person (privacy officers, or the person
        themselves)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequest'
      responses:
        '200':
          description: The export.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessExport'
        default:
          $ref: '#/components/responses/Problem'
  /v1/events:
    get:
      operationId: listEvents
      summary: Export the tenant's evidence chain in seq order
      parameters:
      - name: afterSeq
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of evidence events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceEventPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/hr/events:
    post:
      operationId: receiveHrEvent
      summary: Receive a joiner or leaver event from the HR system
      description: 'Authenticated by HMAC, not by the user resolver: X-Muistamo-Tenant
        names the tenant and X-Muistamo-Signature carries t=<unix seconds>,v1=<hex
        HMAC-SHA256 of "t.body"> under the tenant''s HR secret. Signatures older than
        five minutes are refused.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HREvent'
      responses:
        '200':
          description: This event id was already received; nothing new was started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HREventAccepted'
        '202':
          description: Accepted; a workflow is handling it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HREventAccepted'
        default:
          $ref: '#/components/responses/Problem'
components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: Template version or instance revision, quoted.
      schema:
        type: string
  responses:
    TemplateRecord:
      description: A template version.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentTemplateRecord'
    InstanceRecord:
      description: An instance.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentInstanceRecord'
    LinkRecord:
      description: An agent link.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AgentLinkRecord'
    ActionPolicyRecord:
      description: An action policy.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActionPolicyRecord'
    CatalogueRequest:
      description: A catalogue request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CatalogueRequest'
    Problem:
      description: An error (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AccessExport:
      title: AccessExport
      description: 'Everything one service holds about a person: one section per data
        location, each a list of records as stored, plus the evidence events they
        took part in.'
      type: object
      additionalProperties: false
      required:
      - service
      - generatedAt
      - sections
      properties:
        service:
          type: string
          enum:
          - control-plane
          - knowledge
        generatedAt:
          type: string
          format: date-time
        sections:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
    AccessRequest:
      title: AccessRequest
      description: Export everything a service holds about a person (GDPR Art 15,
        FR-309).
      type: object
      additionalProperties: false
      required:
      - subject
      properties:
        subject:
          $ref: '#/components/schemas/PrivacySubject'
    ActionPolicy:
      title: ActionPolicy
      description: 'The actions agents of one template may take with their tools (PRD
        section 8.1, FR-1004). Deny overrides allow: when any deny rule applies, the
        action is denied whatever else allows it, so rule order does not matter. Release
        1 effects are allow, deny and monitor; requireApproval is release 2. At most
        one ActionPolicy applies to a template.'
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: ActionPolicy
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: ActionPolicySpec
          type: object
          additionalProperties: false
          required:
          - appliesTo
          - rules
          properties:
            appliesTo:
              title: ActionPolicyTarget
              type: object
              additionalProperties: false
              required:
              - template
              properties:
                template:
                  type: string
                  pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
            default:
              description: 'What happens to actions no rule allows: deny (the default)
                or allow. allow still yields to every deny rule.'
              type: string
              enum:
              - deny
              - allow
            mode:
              description: 'enforce (the default): once the gateway enforces, denied
                actions are blocked. monitor: they are only reported.'
              type: string
              enum:
              - enforce
              - monitor
            rules:
              type: array
              items:
                title: ActionRule
                type: object
                additionalProperties: false
                required:
                - action
                - effect
                properties:
                  action:
                    description: A tool action, for example email.send.
                    type: string
                    pattern: ^[a-z][a-z0-9_-]{0,62}(\.[a-z0-9_-]{1,63}){0,3}$
                  effect:
                    description: allow, deny, or monitor (allow, and flag for review).
                      requireApproval is release 2.
                    type: string
                    enum:
                    - allow
                    - deny
                    - monitor
                  when:
                    description: 'Request attributes that must all be true for the
                      rule to apply. An attribute the request does not supply counts
                      against the caller: it stops an allow or monitor rule applying,
                      and lets a deny rule apply.'
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}(\.[A-Za-z][A-Za-z0-9_]{0,63}){0,3}$
                  unless:
                    description: Request attributes any one of which, when true, stops
                      the rule applying. A missing attribute counts against the caller,
                      as for when.
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}(\.[A-Za-z][A-Za-z0-9_]{0,63}){0,3}$
    ActionPolicyPage:
      title: ActionPolicyPage
      description: Every ActionPolicy in the tenant, by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActionPolicyRecord'
    ActionPolicyRecord:
      title: ActionPolicyRecord
      description: The current ActionPolicy. Revision increments on every change.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/ActionPolicy'
    AgentInstance:
      title: AgentInstance
      description: An agent bound to a user, team or service, with its own identity
        (PRD section 5). Usually generated.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentInstance
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: AgentInstanceSpec
          type: object
          additionalProperties: false
          required:
          - templateRef
          - binding
          - state
          properties:
            templateRef:
              title: TemplateRef
              type: object
              additionalProperties: false
              required:
              - name
              - version
              properties:
                name:
                  type: string
                version:
                  description: Template version number assigned by the server, for
                    example "3".
                  type: string
                  pattern: ^[1-9][0-9]*$
            binding:
              title: InstanceBinding
              type: object
              additionalProperties: false
              required:
              - type
              - ref
              properties:
                type:
                  type: string
                  enum:
                  - user
                  - team
                  - service
                ref:
                  type: string
            identityRef:
              description: Identity ID of the instance in the identity provider.
              type: string
            sponsor:
              type: string
            delegate:
              type: string
            personalLayerRef:
              type: string
            state:
              description: Must be requested on create; changes only through transitions.
              $ref: '#/components/schemas/InstanceState'
            costCentre:
              type: string
    AgentInstancePage:
      title: AgentInstancePage
      description: A page of instances, ordered by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentInstanceRecord'
        nextCursor:
          description: Absent on the last page.
          type: string
    AgentInstanceRecord:
      title: AgentInstanceRecord
      description: The current state of an AgentInstance. Revision increments on every
        change.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - document
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        document:
          $ref: '#/components/schemas/AgentInstance'
    AgentLink:
      title: AgentLink
      description: 'A one-way permission for agents of one template to call agents
        of another (PRD section 8.1, FR-1003). Without a link, calls are denied. Release
        1: links between Muistamo-hosted templates only; links to external A2A agents
        are release 2.'
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentLink
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: AgentLinkSpec
          type: object
          additionalProperties: false
          required:
          - from
          - to
          - allowedSkills
          - dataClasses
          properties:
            from:
              $ref: '#/components/schemas/AgentLinkEndpoint'
              description: The calling agents.
            to:
              $ref: '#/components/schemas/AgentLinkEndpoint'
              description: The called agents. The link never allows calls the other
                way.
            allowedSkills:
              description: Skills of the called agent the caller may use.
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
            dataClasses:
              description: Data classes a call may carry. A call carrying any other
                class is denied.
              type: array
              uniqueItems: true
              items:
                type: string
                pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
            actFor:
              description: 'same-user (the default): the called agent acts with the
                calling human''s own access. service: it acts as itself.'
              type: string
              enum:
              - same-user
              - service
            maxDelegationDepth:
              description: 'The deepest point in a delegation chain at which this
                call is allowed. 1 (the default) means direct calls only: the called
                agent may not pass the work on.'
              type: integer
              minimum: 1
              maximum: 5
            rateLimit:
              description: 'For example 60/min. Stored, but not yet evaluated: it
                needs the gateway''s counters.'
              type: string
              pattern: ^[1-9][0-9]{0,6}/(s|min|h|day)$
    AgentLinkEndpoint:
      title: AgentLinkEndpoint
      description: One end of an AgentLink. Release 1 selects agents by template;
        clones, instances and labels come later.
      type: object
      additionalProperties: false
      required:
      - template
      properties:
        template:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
    AgentLinkPage:
      title: AgentLinkPage
      description: Every AgentLink in the tenant, by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentLinkRecord'
    AgentLinkRecord:
      title: AgentLinkRecord
      description: The current AgentLink. Revision increments on every change.
      type: object
      additionalProperties: false
      required:
      - revision
      - createdAt
      - updatedAt
      - updatedBy
      - document
      properties:
        revision:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
        document:
          $ref: '#/components/schemas/AgentLink'
    AgentTemplate:
      title: AgentTemplate
      description: A reusable agent definition owned by the company (PRD section 5).
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: AgentTemplate
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: AgentTemplateSpec
          type: object
          additionalProperties: false
          required:
          - purpose
          - modelAlias
          properties:
            purpose:
              type: string
            riskTier:
              type: string
              enum:
              - low
              - medium
              - high
            modelAlias:
              description: Name of a ModelAlias, never a concrete provider model.
              type: string
            knowledgePacks:
              type: array
              items:
                title: KnowledgePackRef
                type: object
                additionalProperties: false
                required:
                - name
                properties:
                  name:
                    type: string
                  version:
                    description: Version constraint, for example 3.x to follow minor
                      updates.
                    type: string
            tools:
              type: array
              items:
                type: string
            dataClasses:
              type: array
              items:
                type: string
            autonomy:
              type: string
            assignment:
              title: AgentTemplateAssignment
              type: object
              additionalProperties: false
              properties:
                hrJobCodes:
                  type: array
                  items:
                    type: string
            budget:
              title: AgentTemplateBudget
              type: object
              additionalProperties: false
              properties:
                perInstanceMonthlyEUR:
                  type: number
                  minimum: 0
            evaluationSet:
              type: string
    AgentTemplatePage:
      title: AgentTemplatePage
      description: A page of latest template versions, ordered by name.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentTemplateRecord'
        nextCursor:
          description: Absent on the last page.
          type: string
    AgentTemplateRecord:
      title: AgentTemplateRecord
      description: One immutable, server-numbered version of an AgentTemplate.
      type: object
      additionalProperties: false
      required:
      - version
      - createdAt
      - createdBy
      - document
      properties:
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        document:
          $ref: '#/components/schemas/AgentTemplate'
    CatalogueApproval:
      description: One approver's decision on a catalogue request.
      title: CatalogueApproval
      type: object
      additionalProperties: false
      required:
      - approver
      - decision
      - reason
      - decidedAt
      properties:
        approver:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    CatalogueDecision:
      title: CatalogueDecision
      description: An approver's decision on a catalogue request.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    CatalogueEntry:
      title: CatalogueEntry
      description: A template version published to the catalogue and so assignable
        to joiners.
      type: object
      additionalProperties: false
      required:
      - template
      - version
      - requestId
      - publishedAt
      properties:
        template:
          type: string
        version:
          type: integer
          minimum: 1
        requestId:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    CatalogueEntryPage:
      title: CatalogueEntryPage
      description: The published catalogue.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueEntry'
    CatalogueRequest:
      title: CatalogueRequest
      description: A request to publish a template version to the catalogue. Low risk
        publishes at once; medium needs one approver; high needs two distinct approvers;
        never the requester.
      type: object
      additionalProperties: false
      required:
      - id
      - template
      - version
      - requestedBy
      - riskTier
      - neededApprovals
      - state
      - approvals
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        template:
          type: string
        version:
          type: integer
          minimum: 1
        requestedBy:
          type: string
        riskTier:
          description: From the template version; a version without one is treated
            as high.
          type: string
          enum:
          - low
          - medium
          - high
        neededApprovals:
          type: integer
          minimum: 0
          maximum: 2
        state:
          type: string
          enum:
          - pending
          - published
          - rejected
          - withdrawn
          - superseded
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueApproval'
        createdAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
    CatalogueRequestPage:
      title: CatalogueRequestPage
      description: Catalogue requests, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueRequest'
    CheckResult:
      title: CheckResult
      description: One automated check finding. Matched secret values are never echoed.
      type: object
      additionalProperties: false
      required:
      - ruleId
      - severity
      - entryKey
      - message
      properties:
        ruleId:
          type: string
        severity:
          type: string
          enum:
          - blocking
          - warning
        entryKey:
          type: string
        message:
          type: string
    Citation:
      title: Citation
      description: Where a retrieval result came from.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - entry
          - document
        layer:
          type: string
          enum:
          - personal
          - team
          - role
          - company
        pack:
          type: string
        version:
          type: string
        entryKey:
          type: string
        source:
          type: string
        connector:
          type: string
        externalId:
          type: string
        url:
          type: string
        modifiedAt:
          type: string
          format: date-time
    CompiledPolicies:
      title: CompiledPolicies
      description: The tenant's links and action policies as the Cedar policy set
        that is actually evaluated, for review.
      type: object
      additionalProperties: false
      required:
      - cedar
      - rules
      properties:
        cedar:
          description: Cedar policy text, ordered by policy id.
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PolicyRuleRef'
    ErasureProof:
      title: ErasureProof
      description: 'What one service erased for a request, and what it kept and why.
        It holds no identifier of the person: subjectDigest lets someone who already
        knows the identifiers confirm which person it was.'
      type: object
      additionalProperties: false
      required:
      - id
      - service
      - completedAt
      - requestedBy
      - pseudonym
      - counts
      - retained
      - subjectDigest
      properties:
        id:
          type: string
          format: uuid
        service:
          type: string
          enum:
          - control-plane
          - knowledge
        completedAt:
          type: string
          format: date-time
        requestedBy:
          type: string
        pseudonym:
          description: What the person's identifiers were replaced with.
          type: string
        counts:
          description: Rows changed per data location, for example entries.contributor.
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        retained:
          type: array
          items:
            title: ErasureRetention
            type: object
            additionalProperties: false
            required:
            - data
            - reason
            properties:
              data:
                type: string
              reason:
                type: string
        warnings:
          type: array
          items:
            type: string
        subjectDigest:
          description: SHA-256 (hex) over the tenant id and the sorted identifiers.
          type: string
          pattern: ^[0-9a-f]{64}$
    ErasureRequest:
      title: ErasureRequest
      description: Erase a person's data (GDPR Art 17, FR-309). The client chooses
        the id and sends the same request to every service; repeating it returns the
        stored proof.
      type: object
      additionalProperties: false
      required:
      - id
      - subject
      - reason
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: '#/components/schemas/PrivacySubject'
        reason:
          description: Why, for example the reference of the data subject's request.
          type: string
          minLength: 1
          maxLength: 2000
        redactEntries:
          description: 'Knowledge service only: entry revisions whose title and body
            are themselves personal data. They and every revision derived from them
            are redacted.'
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    EvidenceEvent:
      title: EvidenceEvent
      description: One signed, hash-chained evidence event. The hashed body and signature
        are defined in control-plane/evidencechain; verify chains with mst evidence
        verify.
      type: object
      additionalProperties: false
      required:
      - tenant
      - seq
      - occurredAt
      - actor
      - action
      - subject
      - before
      - after
      - requestId
      - prevHash
      - hash
      - keyId
      - signature
      properties:
        tenant:
          type: string
          format: uuid
        seq:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        subject:
          title: EvidenceSubject
          type: object
          additionalProperties: false
          required:
          - kind
          - name
          properties:
            kind:
              type: string
            name:
              type: string
        before:
          description: State before the action, or null.
        after:
          description: State after the action, or null.
        requestId:
          type: string
        prevHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        keyId:
          type: string
          pattern: ^[0-9a-f]{32}$
        signature:
          description: Ed25519 signature over the hash bytes, base64.
          type: string
    EvidenceEventPage:
      title: EvidenceEventPage
      description: A page of the tenant's evidence chain, in seq order.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceEvent'
        nextAfterSeq:
          description: Pass as afterSeq for the next page. Absent on the last page.
          type: integer
    HREvent:
      title: HREvent
      description: A joiner or leaver event from the tenant's HR system, in Muistamo's
        own shape. HRIS connectors map their payloads onto this. Sent to POST /v1/hr/events
        with an HMAC signature.
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - occurredAt
      - person
      properties:
        id:
          description: 'The HR system''s event id. Re-sending the same id is safe:
            it is processed once.'
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum:
          - joiner
          - leaver
        occurredAt:
          type: string
          format: date-time
        person:
          title: HRPerson
          type: object
          additionalProperties: false
          required:
          - id
          - email
          - jobCode
          properties:
            id:
              description: Stable employee id in the HR system.
              type: string
              minLength: 1
              maxLength: 200
            email:
              type: string
              minLength: 3
            jobCode:
              type: string
              minLength: 1
    HREventAccepted:
      title: HREventAccepted
      description: Which workflow handles an HR event.
      type: object
      additionalProperties: false
      required:
      - eventId
      - workflowId
      - duplicate
      properties:
        eventId:
          type: string
        workflowId:
          type: string
        duplicate:
          description: True when this event id was already received.
          type: boolean
    HealthStatus:
      title: HealthStatus
      description: Response body of every service health endpoint.
      type: object
      additionalProperties: false
      required:
      - status
      - service
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
    InstanceState:
      title: InstanceState
      description: Lifecycle state of an agent instance (PRD section 5).
      type: string
      enum:
      - requested
      - active
      - under-review
      - suspended
      - retired
      - quarantined
    InstanceTransition:
      title: InstanceTransition
      description: Request to move an instance to another lifecycle state.
      type: object
      additionalProperties: false
      required:
      - to
      properties:
        to:
          $ref: '#/components/schemas/InstanceState'
    KnowledgeEntry:
      title: KnowledgeEntry
      description: An immutable entry revision.
      type: object
      additionalProperties: false
      required:
      - id
      - key
      - type
      - title
      - body
      - dataClass
      - contributor
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        key:
          description: Stable key; the most specific layer wins for the same key.
          type: string
          pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
          maxLength: 120
        type:
          type: string
          enum:
          - skill
          - fact
          - example
        title:
          type: string
        body:
          type: string
        source:
          type: string
        dataClass:
          type: string
          enum:
          - public
          - internal
          - confidential
        contributor:
          type: string
        createdAt:
          type: string
          format: date-time
    KnowledgeEntryInput:
      title: KnowledgeEntryInput
      description: A new entry captured into the caller's personal layer.
      type: object
      additionalProperties: false
      required:
      - key
      - type
      - title
      - body
      properties:
        key:
          description: Stable key; the most specific layer wins for the same key.
          type: string
          pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
          maxLength: 120
        type:
          type: string
          enum:
          - skill
          - fact
          - example
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        source:
          description: Where this knowledge comes from (URL, document, person).
          type: string
          maxLength: 500
        dataClass:
          type: string
          enum:
          - public
          - internal
          - confidential
          default: internal
    KnowledgeEntryPage:
      title: KnowledgeEntryPage
      description: The caller's personal entries.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
    KnowledgePack:
      title: KnowledgePack
      description: A versioned, reviewed body of company knowledge (PRD section 5).
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgePack
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgePackSpec
          type: object
          additionalProperties: false
          required:
          - layer
          properties:
            layer:
              type: string
              enum:
              - company
              - role
              - team
              description: Personal layers are per person and are not packs.
            mandatory:
              description: Users and agents cannot switch a mandatory pack off.
              type: boolean
            reviewers:
              type: array
              items:
                type: string
              description: People (actor names) who may approve or reject proposals
                and roll back versions.
              minItems: 1
            mergePolicy:
              title: MergePolicy
              type: object
              additionalProperties: false
              properties:
                requires:
                  type: array
                  items:
                    type: string
                    enum:
                    - review
                    - evaluation
            storageLocation:
              description: Customer-bound object storage location for pack content.
              type: string
    KnowledgePackPage:
      title: KnowledgePackPage
      description: The tenant's packs.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePackRecord'
    KnowledgePackRecord:
      title: KnowledgePackRecord
      description: A pack definition and its latest content version.
      type: object
      additionalProperties: false
      required:
      - document
      - latestVersion
      - createdAt
      - updatedAt
      properties:
        document:
          $ref: '#/components/schemas/KnowledgePack'
        latestVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    KnowledgeRead:
      title: KnowledgeRead
      description: 'One retrieval a person made: what they were shown, never the query
        text (invariant 5).'
      type: object
      additionalProperties: false
      required:
      - id
      - person
      - at
      - tool
      - resultCount
      - citations
      properties:
        id:
          type: string
          format: uuid
        person:
          type: string
        at:
          type: string
          format: date-time
        tool:
          type: string
          enum:
          - rest.retrieve
          - mcp.search_knowledge
        resultCount:
          type: integer
          minimum: 0
        citations:
          type: array
          items:
            title: ReadCitation
            type: object
            additionalProperties: false
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - entry
                - document
              entryKey:
                type: string
              layer:
                type: string
              pack:
                type: string
              version:
                type: string
              source:
                type: string
              externalId:
                type: string
    KnowledgeReadPage:
      title: KnowledgeReadPage
      description: The caller's own reads, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeRead'
    KnowledgeSource:
      title: KnowledgeSource
      description: A document source attached to a pack (PRD section 10). Its documents
        are indexed, and every retrieval authorises each document live against the
        acting person's own rights at the source.
      type: object
      additionalProperties: false
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgeSource
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgeSourceSpec
          type: object
          additionalProperties: false
          required:
          - pack
          - connector
          properties:
            pack:
              description: The pack whose readers search this source.
              type: string
            connector:
              description: sharepoint is release 1's one source (not built yet). test
                is an in-memory connector for development and the adversarial suite,
                refused unless explicitly enabled.
              type: string
              enum:
              - sharepoint
              - test
            sharepoint:
              title: SharePointSourceConfig
              type: object
              additionalProperties: false
              required:
              - siteUrl
              properties:
                siteUrl:
                  type: string
            test:
              title: TestSourceConfig
              type: object
              additionalProperties: false
              required:
              - documents
              properties:
                documents:
                  type: array
                  maxItems: 500
                  items:
                    title: TestSourceDocument
                    type: object
                    additionalProperties: false
                    required:
                    - id
                    - title
                    - body
                    - readers
                    properties:
                      id:
                        type: string
                        minLength: 1
                      title:
                        type: string
                      body:
                        type: string
                      url:
                        type: string
                      readers:
                        description: Actor names who may open the document.
                        type: array
                        items:
                          type: string
    KnowledgeSourcePage:
      title: KnowledgeSourcePage
      description: The tenant's sources.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeSourceRecord'
    KnowledgeSourceRecord:
      title: KnowledgeSourceRecord
      description: A source and its index state.
      type: object
      additionalProperties: false
      required:
      - document
      - documentCount
      - createdAt
      - updatedAt
      properties:
        document:
          $ref: '#/components/schemas/KnowledgeSource'
        documentCount:
          type: integer
        lastSyncedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ObjectMeta:
      title: ObjectMeta
      description: Metadata shared by every Muistamo YAML kind.
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          description: Unique name of the object within its tenant.
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        owner:
          description: Owning team or person reference.
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
    PackEntry:
      title: PackEntry
      description: An entry in a pack version, with lineage.
      type: object
      additionalProperties: false
      required:
      - entry
      - proposal
      - reviewer
      properties:
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        proposal:
          description: The proposal that merged it.
          type: string
          format: uuid
        reviewer:
          type: string
    PackVersion:
      title: PackVersion
      description: An immutable version of a pack's content.
      type: object
      additionalProperties: false
      required:
      - pack
      - version
      - reason
      - createdBy
      - createdAt
      - entries
      properties:
        pack:
          type: string
        version:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
        parent:
          type: string
        reason:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PackEntry'
    PackVersionPage:
      title: PackVersionPage
      description: A pack's versions, newest first.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PackVersion'
    PolicyDecision:
      title: PolicyDecision
      description: 'The policy engine''s answer. Release 1 runs in observe mode: nothing
        is enforced yet (the gateway is not built), so enforced is always false and
        wouldBlock says what enforcement would do.'
      type: object
      additionalProperties: false
      required:
      - decision
      - wouldBlock
      - monitored
      - mode
      - enforced
      - reason
      - matchedRules
      - checked
      - notEvaluated
      properties:
        decision:
          description: What the rules say.
          type: string
          enum:
          - allow
          - deny
        wouldBlock:
          description: 'Whether enforcement would block this: a denial, unless the
            denying ActionPolicy is in monitor mode.'
          type: boolean
        monitored:
          description: 'A monitor rule matched, or a monitor-mode policy denied: the
            request is flagged for review.'
          type: boolean
        policyMode:
          description: 'action: the mode of the ActionPolicy for the agent, if one
            exists.'
          type: string
          enum:
          - enforce
          - monitor
        mode:
          type: string
          const: observe
        enforced:
          type: boolean
          const: false
        reason:
          description: A plain-language explanation.
          type: string
        matchedRules:
          description: 'The rules that decided: the allowing ones for an allow, the
            denying ones for a deny. Empty for a denial by default.'
          type: array
          items:
            $ref: '#/components/schemas/PolicyRuleRef'
        checked:
          description: The parts of the effective permission that were evaluated.
          type: array
          items:
            type: string
        notEvaluated:
          description: Parts of the effective permission that release 1 cannot evaluate
            yet.
          type: array
          items:
            type: string
    PolicyDecisionRequest:
      title: PolicyDecisionRequest
      description: 'A question for the policy engine: may this agent call that one
        (kind call), or take this tool action (kind action)? Agents are named by template
        in release 1.'
      type: object
      additionalProperties: false
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - call
          - action
        from:
          description: 'call: the calling template.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        to:
          description: 'call: the called template.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        skill:
          description: 'call: the skill of the called agent being used.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
        dataClasses:
          description: 'call: every data class the call carries (none if omitted).'
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$
        depth:
          description: 'call: position in the delegation chain; 1 (the default) is
            a direct call.'
          type: integer
          minimum: 1
          maximum: 100
        actFor:
          description: 'call: whose access the called agent uses (default same-user).'
          type: string
          enum:
          - same-user
          - service
        agent:
          description: 'action: the template taking the action.'
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        action:
          description: 'action: the tool action, for example email.send.'
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}(\.[a-z0-9_-]{1,63}){0,3}$
        attributes:
          description: 'action: facts about the request that rules can test, for example
            recipients.allInternal.'
          type: object
          propertyNames:
            pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}(\.[A-Za-z][A-Za-z0-9_]{0,63}){0,3}$
          additionalProperties:
            type: boolean
      allOf:
      - if:
          properties:
            kind:
              const: call
        then:
          required:
          - from
          - to
          - skill
          not:
            anyOf:
            - required:
              - agent
            - required:
              - action
            - required:
              - attributes
      - if:
          properties:
            kind:
              const: action
        then:
          required:
          - agent
          - action
          not:
            anyOf:
            - required:
              - from
            - required:
              - to
            - required:
              - skill
            - required:
              - dataClasses
            - required:
              - depth
            - required:
              - actFor
    PolicyRuleRef:
      title: PolicyRuleRef
      description: One compiled Cedar policy and the document it came from.
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - effect
      properties:
        id:
          description: The Cedar policy id, for example link/analyst-intern-to-market-data
            or action-policy/analyst-intern-actions/rule/2.
          type: string
        kind:
          type: string
          enum:
          - AgentLink
          - ActionPolicy
        name:
          description: metadata.name of the source document.
          type: string
        rule:
          description: 'ActionPolicy: the 1-based index of the rule; absent for the
            policy''s default.'
          type: integer
          minimum: 1
        effect:
          type: string
          enum:
          - allow
          - deny
          - monitor
    PolicySimulation:
      title: PolicySimulation
      description: The same request decided under the current and the proposed rules.
      type: object
      additionalProperties: false
      required:
      - current
      - proposed
      - changed
      properties:
        current:
          $ref: '#/components/schemas/PolicyDecision'
        proposed:
          $ref: '#/components/schemas/PolicyDecision'
        changed:
          description: Whether the decision or wouldBlock differs.
          type: boolean
    PolicySimulationRequest:
      title: PolicySimulationRequest
      description: Decide a request under the current rules and under proposed ones.
        A proposed document replaces the current one of the same kind and name, or
        is added. Nothing is stored and no evidence is written.
      type: object
      additionalProperties: false
      required:
      - request
      properties:
        request:
          $ref: '#/components/schemas/PolicyDecisionRequest'
        links:
          type: array
          items:
            $ref: '#/components/schemas/AgentLink'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ActionPolicy'
    PrivacySubject:
      title: PrivacySubject
      description: The person an erasure or access request is about, by every identifier
        Muistamo may hold for them.
      type: object
      additionalProperties: false
      required:
      - identities
      - email
      properties:
        identities:
          description: Actor identities exactly as Muistamo records them, for example
            dev:person-a@example.invalid.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 3
            maxLength: 320
        email:
          type: string
          minLength: 3
          maxLength: 320
        hrPersonId:
          description: The HR system's person id, if the person came through HR events.
          type: string
          minLength: 1
          maxLength: 128
    Problem:
      title: Problem
      description: Error body (RFC 9457 problem details).
      type: object
      required:
      - title
      - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Proposal:
      title: Proposal
      description: A proposal of entries to a pack, with check results and the decision.
      type: object
      additionalProperties: false
      required:
      - id
      - pack
      - contributor
      - summary
      - status
      - entries
      - checks
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        pack:
          type: string
        contributor:
          type: string
        summary:
          type: string
        status:
          type: string
          enum:
          - checks-failed
          - in-review
          - approved
          - rejected
        entries:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeEntry'
        checks:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        decision:
          $ref: '#/components/schemas/ProposalDecisionRecord'
        mergedVersion:
          type: string
        createdAt:
          type: string
          format: date-time
    ProposalDecision:
      title: ProposalDecision
      description: A reviewer's decision on a proposal.
      type: object
      additionalProperties: false
      required:
      - decision
      - reason
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        edits:
          description: 'Approve with edits: replacement bodies by entry key.'
          type: array
          items:
            title: EntryEdit
            type: object
            additionalProperties: false
            required:
            - key
            - body
            properties:
              key:
                description: Stable key; the most specific layer wins for the same
                  key.
                type: string
                pattern: ^[a-z0-9]+([.-][a-z0-9]+)*$
                maxLength: 120
              body:
                type: string
                minLength: 1
                maxLength: 20000
    ProposalDecisionRecord:
      title: ProposalDecisionRecord
      description: The reviewer's decision.
      type: object
      additionalProperties: false
      required:
      - reviewer
      - decision
      - reason
      - decidedAt
      properties:
        reviewer:
          type: string
        decision:
          type: string
          enum:
          - approve
          - reject
        reason:
          type: string
        decidedAt:
          type: string
          format: date-time
    ProposalInput:
      title: ProposalInput
      description: Propose personal entries to a pack.
      type: object
      additionalProperties: false
      required:
      - pack
      - entryIds
      - summary
      properties:
        pack:
          type: string
        entryIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        summary:
          type: string
          minLength: 1
          maxLength: 2000
    ProposalPage:
      title: ProposalPage
      description: Proposals visible to the caller.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Proposal'
    ResolvedEntry:
      title: ResolvedEntry
      description: An effective entry for the caller, and where it came from.
      type: object
      additionalProperties: false
      required:
      - entry
      - layer
      properties:
        entry:
          $ref: '#/components/schemas/KnowledgeEntry'
        layer:
          type: string
          enum:
          - personal
          - team
          - role
          - company
        pack:
          type: string
        version:
          type: string
    ResolvedEntryPage:
      title: ResolvedEntryPage
      description: The caller's effective knowledge.
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedEntry'
    RetrievalResult:
      title: RetrievalResult
      description: Results the caller may see, each cited, and which sources were
        consulted.
      type: object
      additionalProperties: false
      required:
      - query
      - items
      - coverage
      properties:
        query:
          type: string
        items:
          type: array
          items:
            title: RetrievalItem
            type: object
            additionalProperties: false
            required:
            - title
            - snippet
            - score
            - citation
            properties:
              title:
                type: string
              snippet:
                type: string
              score:
                type: number
              citation:
                $ref: '#/components/schemas/Citation'
        coverage:
          title: RetrievalCoverage
          type: object
          additionalProperties: false
          required:
          - sourcesQueried
          - sourcesUnavailable
          - testConnectors
          properties:
            sourcesQueried:
              type: array
              items:
                type: string
            sourcesUnavailable:
              description: Sources whose authorisation failed; their documents were
                withheld, never returned unchecked.
              type: array
              items:
                type: string
            testConnectors:
              description: Sources served by the in-memory test connector, not a real
                system.
              type: array
              items:
                type: string
    RollbackInput:
      title: RollbackInput
      description: Publish a new version with an earlier version's content.
      type: object
      additionalProperties: false
      required:
      - toVersion
      - reason
      properties:
        toVersion:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    SyncResult:
      title: SyncResult
      description: What a sync changed in the index.
      type: object
      additionalProperties: false
      required:
      - source
      - indexed
      - removed
      - total
      properties:
        source:
          type: string
        indexed:
          type: integer
        removed:
          type: integer
        total:
          type: integer
