      - kind
      - metadata
      - spec
      properties:
        apiVersion:
          type: string
          const: muistamo.dev/v1
        kind:
          type: string
          const: KnowledgePack
        metadata:
          $ref: '#/components/schemas/ObjectMeta'
        spec:
          title: KnowledgePackSpec
          type: object
          additionalProperties: false
          required:
