openapi: 3.1.0
info:
  title: Muistamo API
  version: 0.1.0
  description: Control-plane API. Schemas live in ../schemas and are referenced, never
    copied. Every /v1 call is scoped to one tenant; until real authentication exists
    the tenant comes from a development-only header that is disabled by default.
servers:
- url: http://localhost:8080
paths:
  /healthz:
