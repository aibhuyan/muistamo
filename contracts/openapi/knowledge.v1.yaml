openapi: 3.1.0
info:
  title: Muistamo knowledge API
  version: 0.1.0
  description: >-
    The knowledge service: packs, the personal layer, proposals, review, versions and layer
    resolution. Schemas live in ../schemas and are referenced, never copied. Every call is scoped
    to one tenant and one acting person; until real authentication exists both come from
    development-only headers that are disabled by default.
servers:
  - url: http://localhost:8001
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/healthstatus.json"

  /v1/knowledge/packs:
    get:
      operationId: listPacks
      responses:
        "200":
          description: The tenant's packs.
          content:
            application/json:
              schema:
                $ref: "../schemas/knowledgepackpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/packs/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getPack
      responses:
        "200":
          $ref: "#/components/responses/PackRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyPack
      summary: Create or update a pack definition (content changes only through proposals)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/knowledgepack.json"
      responses:
        "200":
          $ref: "#/components/responses/PackRecord"
        "201":
          $ref: "#/components/responses/PackRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/packs/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: listPackVersions
      responses:
        "200":
          description: The pack's versions, newest first.
          content:
            application/json:
              schema:
                $ref: "../schemas/packversionpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/packs/{name}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: version
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPackVersion
      responses:
        "200":
          $ref: "#/components/responses/PackVersion"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/packs/{name}/versions/{version}/skills.zip:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: version
        in: path
        required: true
        description: A published version, or "latest".
        schema:
          type: string
    get:
      operationId: exportSkills
      summary: The version as a deterministic Agent Skills zip (agentskills.io)
      description: >-
        One SKILL.md for the pack (facts, an index of procedures, examples in references/) and
        one per skill entry. Only published, reviewed content; never personal layers or open
        proposals. Each export is recorded as evidence with the archive's SHA-256.
      responses:
        "200":
          description: The archive. X-Muistamo-Pack-Version names the exported version.
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/packs/{name}/rollback:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: rollbackPack
      summary: Publish a new version with an earlier version's content (reviewers only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/rollbackinput.json"
      responses:
        "201":
          $ref: "#/components/responses/PackVersion"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/packs/{name}/entries/{key}/verification:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: key
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: verifyEntry
      summary: Confirm a pack entry is still right, restarting its decay clock (reviewers, never its contributor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/verificationinput.json"
      responses:
        "200":
          description: The entry with its renewed decay state.
          content:
            application/json:
              schema:
                $ref: "../schemas/entryverification.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/verifications:
    get:
      operationId: listVerifications
      summary: Entries due or expired in packs the caller may confirm (FR-307)
      responses:
        "200":
          description: Soonest to expire first.
          content:
            application/json:
              schema:
                $ref: "../schemas/verificationpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/personal/entries:
    get:
      operationId: listPersonalEntries
      summary: The caller's own personal layer
      responses:
        "200":
          description: The caller's entries.
          content:
            application/json:
              schema:
                $ref: "../schemas/knowledgeentrypage.json"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: captureEntry
      summary: Capture an entry into the caller's personal layer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/knowledgeentryinput.json"
      responses:
        "201":
          description: Captured.
          content:
            application/json:
              schema:
                $ref: "../schemas/knowledgeentry.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/personal/entries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteEntry
      summary: Delete one of the caller's personal entries
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/proposals:
    get:
      operationId: listProposals
      summary: Proposals the caller made, or may review
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [contributor, reviewer]
            default: contributor
      responses:
        "200":
          description: Proposals.
          content:
            application/json:
              schema:
                $ref: "../schemas/proposalpage.json"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProposal
      summary: Propose the caller's personal entries to a pack; checks run immediately
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/proposalinput.json"
      responses:
        "201":
          $ref: "#/components/responses/Proposal"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/proposals/{id}:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: getProposal
      responses:
        "200":
          $ref: "#/components/responses/Proposal"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/proposals/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: decideProposal
      summary: Approve (merging a new pack version) or reject; reviewers only, never one's own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/proposaldecision.json"
      responses:
        "200":
          $ref: "#/components/responses/Proposal"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/resolve:
    get:
      operationId: resolve
      summary: The caller's effective entries across layers; the most specific layer wins
      parameters:
        - name: packs
          in: query
          required: false
          description: Comma-separated pack names. Mandatory packs are always included.
          schema:
            type: string
      responses:
        "200":
          description: Effective entries.
          content:
            application/json:
              schema:
                $ref: "../schemas/resolvedentrypage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/sources:
    get:
      operationId: listSources
      responses:
        "200":
          description: The tenant's sources.
          content:
            application/json:
              schema:
                $ref: "../schemas/knowledgesourcepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/sources/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getSource
      responses:
        "200":
          $ref: "#/components/responses/SourceRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applySource
      summary: Create or update a source (the pack's reviewers only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/knowledgesource.json"
      responses:
        "200":
          $ref: "#/components/responses/SourceRecord"
        "201":
          $ref: "#/components/responses/SourceRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/sources/{name}/sync:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: syncSource
      summary: Re-index the source's documents (the pack's reviewers only)
      responses:
        "200":
          description: What changed in the index.
          content:
            application/json:
              schema:
                $ref: "../schemas/syncresult.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/retrieve:
    get:
      operationId: retrieve
      summary: Search the caller's effective entries and the requested packs' documents
      description: >-
        Every document is authorised live against the acting person's own rights at its source
        before it is returned (invariant 1). If a source cannot authorise, its documents are
        withheld and the source is listed as unavailable.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: packs
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Authorised, cited results.
          content:
            application/json:
              schema:
                $ref: "../schemas/retrievalresult.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/reads:
    get:
      operationId: listReads
      summary: The caller's own knowledge reads (citations only, never query text)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: The caller's reads.
          content:
            application/json:
              schema:
                $ref: "../schemas/knowledgereadpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/privacy/erasures:
    post:
      operationId: knowledgeErasePersonalData
      summary: Erase a person's data (privacy officers only); repeating an id returns the stored proof
      description: >-
        Deletes the person's own data, replaces their identifiers with a pseudonym where records
        must stay (lineage, published history), and records a signed privacy.erasure.completed
        event. Evidence events are retained under GDPR Art 17(3); the proof says so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/erasurerequest.json"
      responses:
        "200":
          description: This id was already completed; the stored proof.
          content:
            application/json:
              schema:
                $ref: "../schemas/erasureproof.json"
        "201":
          description: Erased.
          content:
            application/json:
              schema:
                $ref: "../schemas/erasureproof.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/privacy/erasures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: knowledgeGetErasure
      summary: The proof of a completed erasure (privacy officers only)
      responses:
        "200":
          description: The proof.
          content:
            application/json:
              schema:
                $ref: "../schemas/erasureproof.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/privacy/access:
    post:
      operationId: knowledgeExportPersonalData
      summary: Export everything held about a person (privacy officers, or the person themselves)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/accessrequest.json"
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "../schemas/accessexport.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/leaver-reviews:
    get:
      operationId: listLeaverReviews
      summary: Reviews of leavers' personal layers that the caller decides
      responses:
        "200":
          description: Open reviews first.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreviewpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/leaver-reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getLeaverReview
      summary: A review with the leaver's personal entries (its decider only; every read is recorded)
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreview.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/leaver-reviews/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: decideLeaverReview
      summary: Merge chosen entries as a proposal, keep for one more period, or purge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/leaverreviewdecision.json"
      responses:
        "200":
          description: The review after the decision.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreview.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/internal/leaver-reviews:
    post:
      operationId: openLeaverReview
      summary: Open and freeze a leaver's personal-layer review (service call)
      description: >-
        Service call from the control plane's leaver workflow only: authenticated by
        X-Muistamo-Tenant and X-Muistamo-Signature (t=<unix seconds>,v1=<hex HMAC-SHA256 of
        "t.body"> under the tenant's service secret), never by a user identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/leaverreviewopen.json"
      responses:
        "200":
          description: Already open for this id.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreview.json"
        "201":
          description: Opened.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreview.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/internal/leaver-reviews/{id}/expire:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: expireLeaverReview
      summary: At or after the deadline, purge an undecided layer; otherwise report the deadline (service call)
      description: >-
        Service call from the control plane's leaver workflow only: authenticated by
        X-Muistamo-Tenant and X-Muistamo-Signature (t=<unix seconds>,v1=<hex HMAC-SHA256 of
        "t.body"> under the tenant's service secret), never by a user identity.
      responses:
        "200":
          description: The review; still open with a later deadline if it was kept.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreview.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/internal/leaver-reviews/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelLeaverReview
      summary: The person was rehired; close an open review and unfreeze the layer (service call)
      description: >-
        Service call from the control plane's leaver workflow only: authenticated by
        X-Muistamo-Tenant and X-Muistamo-Signature (t=<unix seconds>,v1=<hex HMAC-SHA256 of
        "t.body"> under the tenant's service secret), never by a user identity.
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "../schemas/leaverreview.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/knowledge/events:
    get:
      operationId: listEvents
      summary: Export the tenant's knowledge evidence chain in seq order
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: A page of evidence events.
          content:
            application/json:
              schema:
                $ref: "../schemas/evidenceeventpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /mcp/knowledge:
    post:
      operationId: mcpKnowledge
      summary: Muistamo MCP server (streamable HTTP, stateless)
      description: >-
        Tools search_knowledge, remember and propose_knowledge. The caller is resolved from each
        request exactly as for the REST API; unresolvable callers get 401 before the MCP layer.
        Tool inputs follow knowledgeentryinput and proposalinput.
      responses:
        "200":
          description: An MCP JSON-RPC response.
        "401":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    PackRecord:
      description: A pack.
      content:
        application/json:
          schema:
            $ref: "../schemas/knowledgepackrecord.json"
    PackVersion:
      description: A pack version.
      content:
        application/json:
          schema:
            $ref: "../schemas/packversion.json"
    SourceRecord:
      description: A source.
      content:
        application/json:
          schema:
            $ref: "../schemas/knowledgesourcerecord.json"
    Proposal:
      description: A proposal.
      content:
        application/json:
          schema:
            $ref: "../schemas/proposal.json"
    Problem:
      description: An error (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common/problem.json"
