openapi: 3.1.0
info:
  title: Muistamo API
  version: 0.1.0
  description: >-
    Control-plane API. Schemas live in ../schemas and are referenced, never copied.
    Every /v1 call is scoped to one tenant; until real authentication exists the tenant
    comes from a development-only header that is disabled by default.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/healthstatus.json"

  /v1/templates:
    get:
      operationId: listTemplates
      summary: List the latest version of every template
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of templates.
          content:
            application/json:
              schema:
                $ref: "../schemas/agenttemplatepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getTemplate
      summary: Get the latest version of a template
      responses:
        "200":
          $ref: "#/components/responses/TemplateRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyTemplate
      summary: Apply a template; a changed document creates a new immutable version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agenttemplate.json"
      responses:
        "200":
          $ref: "#/components/responses/TemplateRecord"
        "201":
          $ref: "#/components/responses/TemplateRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getTemplateVersion
      summary: Get one version of a template
      responses:
        "200":
          $ref: "#/components/responses/TemplateRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}/versions/{version}/publication:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: requestPublication
      summary: Ask for this template version to be published to the catalogue
      responses:
        "201":
          $ref: "#/components/responses/CatalogueRequest"
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue:
    get:
      operationId: listCatalogue
      summary: Template versions published to the catalogue (assignable to joiners)
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "../schemas/catalogueentrypage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    delete:
      operationId: withdrawFromCatalogue
      summary: Withdraw a template; new joiners stop receiving it, existing instances are untouched
      responses:
        "204":
          description: Withdrawn.
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue/requests:
    get:
      operationId: listCatalogueRequests
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, published, rejected, withdrawn, superseded]
      responses:
        "200":
          description: Requests, newest first.
          content:
            application/json:
              schema:
                $ref: "../schemas/cataloguerequestpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue/requests/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideCatalogueRequest
      summary: Approve or reject (catalogue approvers only; never the requester, never twice)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/cataloguedecision.json"
      responses:
        "200":
          $ref: "#/components/responses/CatalogueRequest"
        default:
          $ref: "#/components/responses/Problem"

  /v1/clones:
    get:
      operationId: listClones
      summary: List every clone and how it resolves
      responses:
        "200":
          description: Clones, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/agentclonepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/clones/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getClone
      responses:
        "200":
          $ref: "#/components/responses/CloneRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyClone
      summary: Create or change a clone; its template cannot change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agentclone.json"
      responses:
        "200":
          $ref: "#/components/responses/CloneRecord"
        "201":
          $ref: "#/components/responses/CloneRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/clones/{name}/sync:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: syncClone
      summary: Move a manual clone to its template's published version
      responses:
        "200":
          $ref: "#/components/responses/CloneRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}/clones:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: listTemplateClones
      summary: The clones of one template
      responses:
        "200":
          description: Clones, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/agentclonepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/models:
    get:
      operationId: listModels
      summary: The model catalogue and each model's approval
      responses:
        "200":
          description: Models, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelcatalogueitempage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/models/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getModel
      responses:
        "200":
          description: A model.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelcatalogueitemrecord.json"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyModel
      summary: Add or change a catalogue model; any change needs approval again
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/modelcatalogueitem.json"
      responses:
        "200":
          description: Changed (or unchanged).
          content:
            application/json:
              schema:
                $ref: "../schemas/modelcatalogueitemrecord.json"
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelcatalogueitemrecord.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/models/{name}/approval:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: decideModel
      summary: Approve, reject or revoke a model (privacy officers; never its last editor)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/modelapprovaldecision.json"
      responses:
        "200":
          description: The model after the decision.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelcatalogueitemrecord.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/model-aliases:
    get:
      operationId: listModelAliases
      responses:
        "200":
          description: Aliases, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelaliaspage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/model-aliases/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getModelAlias
      responses:
        "200":
          description: An alias.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelaliasrecord.json"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyModelAlias
      summary: Create an alias on an approved model, or change its description; retargeting is a rollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/modelalias.json"
      responses:
        "200":
          description: Changed (or unchanged).
          content:
            application/json:
              schema:
                $ref: "../schemas/modelaliasrecord.json"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "../schemas/modelaliasrecord.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/model-aliases/{name}/rollouts:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: startRollout
      summary: Switch the alias to another approved model (unevaluated until the gateway exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/rolloutrequest.json"
      responses:
        "201":
          description: The rollout.
          content:
            application/json:
              schema:
                $ref: "../schemas/rollout.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rollouts:
    get:
      operationId: listRollouts
      responses:
        "200":
          description: Rollouts, newest first.
          content:
            application/json:
              schema:
                $ref: "../schemas/rolloutpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rollouts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRollout
      responses:
        "200":
          description: A rollout.
          content:
            application/json:
              schema:
                $ref: "../schemas/rollout.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/rollouts/{id}/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: rollbackRollout
      summary: Return the alias to the model it had before this rollout, if that model is still approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/rollbackrequest.json"
      responses:
        "200":
          description: The rolled-back rollout.
          content:
            application/json:
              schema:
                $ref: "../schemas/rollout.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/virtual-keys:
    get:
      operationId: listVirtualKeys
      summary: Virtual keys the caller may see, newest first, never with secrets
      parameters:
        - name: instance
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Keys.
          content:
            application/json:
              schema:
                $ref: "../schemas/virtualkeypage.json"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: issueVirtualKey
      summary: Issue a gateway virtual key to an active instance (gateway administrators only); the secret is returned once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/virtualkeyrequest.json"
      responses:
        "201":
          description: The key and its one-time secret.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "../schemas/virtualkeyissued.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/virtual-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getVirtualKey
      responses:
        "200":
          description: The key, without its secret.
          content:
            application/json:
              schema:
                $ref: "../schemas/virtualkey.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/virtual-keys/{id}/revocation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeVirtualKey
      summary: Revoke a key; final, and effective at the gateway within 30 seconds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/virtualkeyrevocation.json"
      responses:
        "200":
          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: "../schemas/virtualkey.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/usage:
    get:
      operationId: listUsage
      summary: Authorized gateway calls and their cost at provider prices, metered or not
      parameters:
        - name: instance
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: unmetered
          in: query
          required: false
          description: >-
            Only model calls authorized more than 15 minutes ago with no usage record. Their cost
            is unknown and may have been incurred: the call may not have run (the gateway can
            reject an authorized call), may have run without reporting usage (an aborted stream,
            a failed response), or its usage may have been lost in export or refused by ingest.
            Reported, never estimated.
          schema:
            type: boolean
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: >-
            Calls, newest first. Gateway administrators see the tenant's calls; anyone else sees
            only calls made for them.
          content:
            application/json:
              schema:
                $ref: "../schemas/usagepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances:
    get:
      operationId: listInstances
      summary: List instances
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of instances.
          content:
            application/json:
              schema:
                $ref: "../schemas/agentinstancepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getInstance
      summary: Get an instance
      responses:
        "200":
          $ref: "#/components/responses/InstanceRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyInstance
      summary: Create an instance, or update its sponsor, delegate and cost centre
      description: >-
        Creating requires spec.state = requested and no If-Match. Updating requires If-Match
        with the current ETag; state changes go through transitions.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agentinstance.json"
      responses:
        "200":
          $ref: "#/components/responses/InstanceRecord"
        "201":
          $ref: "#/components/responses/InstanceRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances/{name}/effective:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getEffectiveSpec
      summary: The spec the instance runs with, through its clone if it has one
      description: Refused with 409 when the instance's clone cannot resolve to a template version.
      responses:
        "200":
          description: The effective spec.
          content:
            application/json:
              schema:
                $ref: "../schemas/effectiveagentspec.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances/{name}/transitions:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: transitionInstance
      summary: Move an instance to another lifecycle state
      description: Requires If-Match with the current ETag; without it the response is 428.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/instancetransition.json"
      responses:
        "200":
          $ref: "#/components/responses/InstanceRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/links:
    get:
      operationId: listLinks
      summary: List every agent link
      responses:
        "200":
          description: The tenant's links, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/agentlinkpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/links/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getLink
      responses:
        "200":
          $ref: "#/components/responses/LinkRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyLink
      summary: Create or change an agent link; an identical document changes nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agentlink.json"
      responses:
        "200":
          $ref: "#/components/responses/LinkRecord"
        "201":
          $ref: "#/components/responses/LinkRecord"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLink
      summary: Remove a link; calls it allowed are denied from then on
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /v1/action-policies:
    get:
      operationId: listActionPolicies
      summary: List every action policy
      responses:
        "200":
          description: The tenant's action policies, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/actionpolicypage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/action-policies/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getActionPolicy
      responses:
        "200":
          $ref: "#/components/responses/ActionPolicyRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyActionPolicy
      summary: Create or change an action policy; at most one applies to a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/actionpolicy.json"
      responses:
        "200":
          $ref: "#/components/responses/ActionPolicyRecord"
        "201":
          $ref: "#/components/responses/ActionPolicyRecord"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteActionPolicy
      summary: Remove an action policy; the template's actions are denied by default from then on
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /v1/policy/decisions:
    post:
      operationId: decidePolicy
      summary: Decide an agent call or tool action (observe mode; recorded as evidence)
      description: >-
        Evaluates the tenant's links and action policies, compiled to Cedar. Deny by default; deny
        overrides allow. Release 1 enforces nothing: the answer says what enforcement would do, and
        every decision is recorded as a signed policy.decision event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/policydecisionrequest.json"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "../schemas/policydecision.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/policy/simulate:
    post:
      operationId: simulatePolicy
      summary: Decide a request under the current and proposed rules, changing nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/policysimulationrequest.json"
      responses:
        "200":
          description: Both decisions.
          content:
            application/json:
              schema:
                $ref: "../schemas/policysimulation.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/policy/cedar:
    get:
      operationId: getCompiledPolicies
      summary: The Cedar policy set the tenant's rules compile to
      responses:
        "200":
          description: The compiled policies.
          content:
            application/json:
              schema:
                $ref: "../schemas/compiledpolicies.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/privacy/erasures:
    post:
      operationId: erasePersonalData
      summary: Erase a person's data (privacy officers only); repeating an id returns the stored proof
      description: >-
        Deletes the person's own data, replaces their identifiers with a pseudonym where records
        must stay (lineage, published history), and records a signed privacy.erasure.completed
        event. Evidence events are retained under GDPR Art 17(3); the proof says so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/erasurerequest.json"
      responses:
        "200":
          description: This id was already completed; the stored proof.
          content:
            application/json:
              schema:
                $ref: "../schemas/erasureproof.json"
        "201":
          description: Erased.
          content:
            application/json:
              schema:
                $ref: "../schemas/erasureproof.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/privacy/erasures/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getErasure
      summary: The proof of a completed erasure (privacy officers only)
      responses:
        "200":
          description: The proof.
          content:
            application/json:
              schema:
                $ref: "../schemas/erasureproof.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/privacy/access:
    post:
      operationId: exportPersonalData
      summary: Export everything held about a person (privacy officers, or the person themselves)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/accessrequest.json"
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema:
                $ref: "../schemas/accessexport.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/events:
    get:
      operationId: listEvents
      summary: Export the tenant's evidence chain in seq order
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of evidence events.
          content:
            application/json:
              schema:
                $ref: "../schemas/evidenceeventpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/hr/events:
    post:
      operationId: receiveHrEvent
      summary: Receive a joiner or leaver event from the HR system
      description: >-
        Authenticated by HMAC, not by the user resolver: X-Muistamo-Tenant names the tenant and
        X-Muistamo-Signature carries t=<unix seconds>,v1=<hex HMAC-SHA256 of "t.body"> under the
        tenant's HR secret. Signatures older than five minutes are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/hrevent.json"
      responses:
        "200":
          description: This event id was already received. A pending workflow handoff is retried; completed or ignored events start no additional work.
          content:
            application/json:
              schema:
                $ref: "../schemas/hreventaccepted.json"
        "202":
          description: Recorded with its acceptance decision. Accepted events have been handed to a workflow; ignored stale events start no workflow.
          content:
            application/json:
              schema:
                $ref: "../schemas/hreventaccepted.json"
        default:
          $ref: "#/components/responses/Problem"

components:
  schemas:
    GatewayAuthzConfig:
      $ref: "../schemas/gatewayauthzconfig.json"
    GatewayAuthorizationRequest:
      $ref: "../schemas/gatewayauthorizationrequest.json"
    GatewayAuthorizationDecision:
      $ref: "../schemas/gatewayauthorizationdecision.json"
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string

  headers:
    ETag:
      description: Template version or instance revision, quoted.
      schema:
        type: string

  responses:
    TemplateRecord:
      description: A template version.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agenttemplaterecord.json"
    InstanceRecord:
      description: An instance.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agentinstancerecord.json"
    CloneRecord:
      description: A clone.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agentclonerecord.json"
    LinkRecord:
      description: An agent link.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agentlinkrecord.json"
    ActionPolicyRecord:
      description: An action policy.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/actionpolicyrecord.json"
    CatalogueRequest:
      description: A catalogue request.
      content:
        application/json:
          schema:
            $ref: "../schemas/cataloguerequest.json"
    Problem:
      description: An error (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common/problem.json"
