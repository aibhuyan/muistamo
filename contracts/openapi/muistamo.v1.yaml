openapi: 3.1.0
info:
  title: Muistamo API
  version: 0.1.0
  description: >-
    Control-plane API. Schemas live in ../schemas and are referenced, never copied.
    Every /v1 call is scoped to one tenant; until real authentication exists the tenant
    comes from a development-only header that is disabled by default.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Service health
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/healthstatus.json"

  /v1/templates:
    get:
      operationId: listTemplates
      summary: List the latest version of every template
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of templates.
          content:
            application/json:
              schema:
                $ref: "../schemas/agenttemplatepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getTemplate
      summary: Get the latest version of a template
      responses:
        "200":
          $ref: "#/components/responses/TemplateRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyTemplate
      summary: Apply a template; a changed document creates a new immutable version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agenttemplate.json"
      responses:
        "200":
          $ref: "#/components/responses/TemplateRecord"
        "201":
          $ref: "#/components/responses/TemplateRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getTemplateVersion
      summary: Get one version of a template
      responses:
        "200":
          $ref: "#/components/responses/TemplateRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/templates/{name}/versions/{version}/publication:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: requestPublication
      summary: Ask for this template version to be published to the catalogue
      responses:
        "201":
          $ref: "#/components/responses/CatalogueRequest"
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue:
    get:
      operationId: listCatalogue
      summary: Template versions published to the catalogue (assignable to joiners)
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "../schemas/catalogueentrypage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    delete:
      operationId: withdrawFromCatalogue
      summary: Withdraw a template; new joiners stop receiving it, existing instances are untouched
      responses:
        "204":
          description: Withdrawn.
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue/requests:
    get:
      operationId: listCatalogueRequests
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, published, rejected, withdrawn, superseded]
      responses:
        "200":
          description: Requests, newest first.
          content:
            application/json:
              schema:
                $ref: "../schemas/cataloguerequestpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/catalogue/requests/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: decideCatalogueRequest
      summary: Approve or reject (catalogue approvers only; never the requester, never twice)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/cataloguedecision.json"
      responses:
        "200":
          $ref: "#/components/responses/CatalogueRequest"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances:
    get:
      operationId: listInstances
      summary: List instances
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of instances.
          content:
            application/json:
              schema:
                $ref: "../schemas/agentinstancepage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getInstance
      summary: Get an instance
      responses:
        "200":
          $ref: "#/components/responses/InstanceRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyInstance
      summary: Create an instance, or update its sponsor, delegate and cost centre
      description: >-
        Creating requires spec.state = requested and no If-Match. Updating requires If-Match
        with the current ETag; state changes go through transitions.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agentinstance.json"
      responses:
        "200":
          $ref: "#/components/responses/InstanceRecord"
        "201":
          $ref: "#/components/responses/InstanceRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/instances/{name}/transitions:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: transitionInstance
      summary: Move an instance to another lifecycle state
      description: Requires If-Match with the current ETag; without it the response is 428.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/instancetransition.json"
      responses:
        "200":
          $ref: "#/components/responses/InstanceRecord"
        default:
          $ref: "#/components/responses/Problem"

  /v1/links:
    get:
      operationId: listLinks
      summary: List every agent link
      responses:
        "200":
          description: The tenant's links, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/agentlinkpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/links/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getLink
      responses:
        "200":
          $ref: "#/components/responses/LinkRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyLink
      summary: Create or change an agent link; an identical document changes nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/agentlink.json"
      responses:
        "200":
          $ref: "#/components/responses/LinkRecord"
        "201":
          $ref: "#/components/responses/LinkRecord"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLink
      summary: Remove a link; calls it allowed are denied from then on
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /v1/action-policies:
    get:
      operationId: listActionPolicies
      summary: List every action policy
      responses:
        "200":
          description: The tenant's action policies, by name.
          content:
            application/json:
              schema:
                $ref: "../schemas/actionpolicypage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/action-policies/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getActionPolicy
      responses:
        "200":
          $ref: "#/components/responses/ActionPolicyRecord"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: applyActionPolicy
      summary: Create or change an action policy; at most one applies to a template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/actionpolicy.json"
      responses:
        "200":
          $ref: "#/components/responses/ActionPolicyRecord"
        "201":
          $ref: "#/components/responses/ActionPolicyRecord"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteActionPolicy
      summary: Remove an action policy; the template's actions are denied by default from then on
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /v1/policy/decisions:
    post:
      operationId: decidePolicy
      summary: Decide an agent call or tool action (observe mode; recorded as evidence)
      description: >-
        Evaluates the tenant's links and action policies, compiled to Cedar. Deny by default; deny
        overrides allow. Release 1 enforces nothing: the answer says what enforcement would do, and
        every decision is recorded as a signed policy.decision event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/policydecisionrequest.json"
      responses:
        "200":
          description: The decision.
          content:
            application/json:
              schema:
                $ref: "../schemas/policydecision.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/policy/simulate:
    post:
      operationId: simulatePolicy
      summary: Decide a request under the current and proposed rules, changing nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/policysimulationrequest.json"
      responses:
        "200":
          description: Both decisions.
          content:
            application/json:
              schema:
                $ref: "../schemas/policysimulation.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/policy/cedar:
    get:
      operationId: getCompiledPolicies
      summary: The Cedar policy set the tenant's rules compile to
      responses:
        "200":
          description: The compiled policies.
          content:
            application/json:
              schema:
                $ref: "../schemas/compiledpolicies.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/events:
    get:
      operationId: listEvents
      summary: Export the tenant's evidence chain in seq order
      parameters:
        - name: afterSeq
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of evidence events.
          content:
            application/json:
              schema:
                $ref: "../schemas/evidenceeventpage.json"
        default:
          $ref: "#/components/responses/Problem"

  /v1/hr/events:
    post:
      operationId: receiveHrEvent
      summary: Receive a joiner or leaver event from the HR system
      description: >-
        Authenticated by HMAC, not by the user resolver: X-Muistamo-Tenant names the tenant and
        X-Muistamo-Signature carries t=<unix seconds>,v1=<hex HMAC-SHA256 of "t.body"> under the
        tenant's HR secret. Signatures older than five minutes are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/hrevent.json"
      responses:
        "200":
          description: This event id was already received; nothing new was started.
          content:
            application/json:
              schema:
                $ref: "../schemas/hreventaccepted.json"
        "202":
          description: Accepted; a workflow is handling it.
          content:
            application/json:
              schema:
                $ref: "../schemas/hreventaccepted.json"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string

  headers:
    ETag:
      description: Template version or instance revision, quoted.
      schema:
        type: string

  responses:
    TemplateRecord:
      description: A template version.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agenttemplaterecord.json"
    InstanceRecord:
      description: An instance.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agentinstancerecord.json"
    LinkRecord:
      description: An agent link.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/agentlinkrecord.json"
    ActionPolicyRecord:
      description: An action policy.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
      content:
        application/json:
          schema:
            $ref: "../schemas/actionpolicyrecord.json"
    CatalogueRequest:
      description: A catalogue request.
      content:
        application/json:
          schema:
            $ref: "../schemas/cataloguerequest.json"
    Problem:
      description: An error (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "../schemas/common/problem.json"
