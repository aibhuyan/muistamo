# Local infrastructure for `make dev`. Development only: fake credentials, in-memory stores,
# ports bound to localhost. Override values from an untracked .env next to this file.
name: muistamo-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muistamo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-not-a-secret}
      POSTGRES_DB: ${POSTGRES_DB:-muistamo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "127.0.0.1:${TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

  openfga:
    image: openfga/openfga:v1.22.0
    command: ["run", "--datastore-engine", "memory"]
    ports:
      - "127.0.0.1:${OPENFGA_HTTP_PORT:-8081}:8080"
      - "127.0.0.1:${OPENFGA_GRPC_PORT:-8082}:8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The gateway profile (make dev-gateway): agentgateway, the development authorization checker
  # and a fake provider. Only the gateway's model listener is published; the checker is plaintext
  # and stays on the compose network (production transport is not integrated).
  fake-provider:
    profiles: [gateway]
    image: python:3.12-slim
    command: ["python", "-u", "/srv/server.py"]
    environment:
      MUISTAMO_PROVIDER_KEY_FAKE: fake-provider-key-not-a-secret
    volumes:
      - ./fake-provider:/srv:ro

  gateway-authz:
    profiles: [gateway]
    build:
      context: ../..
      dockerfile: deploy/dev/control-plane.Dockerfile
    command: ["gateway", "authz", "--config", "/etc/muistamo/authz.json", "--listen", "0.0.0.0:18081", "--insecure-development"]
    environment:
      # The fixed dev login from initdb/01-roles.sql; POSTGRES_PASSWORD is the owner's.
      MUISTAMO_DATABASE_URL: postgres://muistamo_server:dev-only-not-a-secret@postgres:5432/${MUISTAMO_DEV_GATEWAY_DB:-${POSTGRES_DB:-muistamo}}
      MUISTAMO_EVIDENCE_KEY_FILE: /run/muistamo/evidence.pem
    volumes:
      - ./gateway/authz.json:/etc/muistamo/authz.json:ro
      - ${MUISTAMO_DEV_EVIDENCE_KEY:-./gateway/evidence.pem}:/run/muistamo/evidence.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  gateway-ingest:
    profiles: [gateway]
    build:
      context: ../..
      dockerfile: deploy/dev/control-plane.Dockerfile
    command: ["gateway", "ingest", "--config", "/etc/muistamo/authz.json", "--listen", "0.0.0.0:4317", "--insecure-development"]
    environment:
      MUISTAMO_DATABASE_URL: postgres://muistamo_server:dev-only-not-a-secret@postgres:5432/${MUISTAMO_DEV_GATEWAY_DB:-${POSTGRES_DB:-muistamo}}
      MUISTAMO_EVIDENCE_KEY_FILE: /run/muistamo/evidence.pem
      MUISTAMO_GATEWAY_INGEST_TOKEN_FILE: /run/muistamo/ingest-token
    volumes:
      - ./gateway/authz.json:/etc/muistamo/authz.json:ro
      - ${MUISTAMO_DEV_EVIDENCE_KEY:-./gateway/evidence.pem}:/run/muistamo/evidence.pem:ro
      # A fake development token generated by make dev-gateway (gitignored).
      - ./gateway/ingest-token:/run/muistamo/ingest-token:ro
    depends_on:
      postgres:
        condition: service_healthy

  agentgateway:
    profiles: [gateway]
    # agentgateway v1.6.0, pinned by digest (D28; docs/agentgateway-validation-2026-10-28.md).
    image: cr.agentgateway.dev/agentgateway@sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
    command: ["-f", "/etc/agentgateway/config.yaml"]
    environment:
      MUISTAMO_PROVIDER_KEY_FAKE: fake-provider-key-not-a-secret
      # The usage-export credential the rendered configuration references; make dev-gateway passes
      # the generated fake token. Empty means every export is refused by ingest (fails closed).
      MUISTAMO_GATEWAY_INGEST_TOKEN: ${MUISTAMO_DEV_INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4000}:4000"
    # A named volume, not a bind mount: Docker Desktop bind mounts deliver no file events, so
    # hot reload would never fire. make dev-gateway copies the rendered file in.
    volumes:
      - gateway-config:/etc/agentgateway
    depends_on:
      - gateway-authz
      - gateway-ingest
      - fake-provider

volumes:
  postgres-data:
  gateway-config:
