[project]
name = "muistamo-knowledge"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "muistamo-contracts",
    "psycopg[binary]>=3.3,<3.4",
    "psycopg-pool>=3.3,<3.4",
    "rfc8785>=0.1.4,<0.2",
    "cryptography>=50,<51",
    "mcp>=2.3,<2.4",
    "pyjwt[crypto]>=2.15,<3",
]

[tool.uv.sources]
muistamo-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
