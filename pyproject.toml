[project]
name = "muistamo"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts/gen/python", "knowledge", "runtime"]

[dependency-groups]
dev = [
    "datamodel-code-generator",
    "httpx",
    "pytest",
    "pyyaml",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["contracts/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "S"]
# ruff format owns line width; it cannot split string literals, and SQL reads better unsplit.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and compose SQL from constant table names to attack every table.
"**/tests/**" = ["S101", "S608"]
# The separate-binary e2e harness: it asserts, runs the binaries it built, calls loopback URLs and
# hands fake tokens to a fake Microsoft.
"deploy/dev/e2e/**" = ["S101", "S105", "S310", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["knowledge/tests", "runtime/tests", "contracts/tests"]
addopts = "--strict-markers --import-mode=importlib"
xfail_strict = true
markers = [
    "authz: adversarial permission suite, run by make test-authz; never skip or weaken",
]
